<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>GuideFlow — Interactive Guide</title>
  
  <!-- Google Fonts: Mali & Noto Sans Thai Looped -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Noto+Sans+Thai+Looped:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #26394A;
      --ink-light: #3E5468;
      --cream: #FBFAF7;
      --lavender: #7A6FB1;
      --mint: #5FA99E;
      --mint-dark: #46867D;
      --coral: #E8877A;
      --coral-hover: #D97365;
      --gold: #D2A54B;
      --sky: #70A7C7;
      --bg: #DCE2E7;
      --card-bg: #FFFFFF;
      --border: #E2E8F0;
      --border-dark: #CBD5E1;
      --text-muted: #64748B;
      --shadow-sm: 0 4px 12px rgba(38, 57, 74, 0.06);
      --shadow-md: 0 12px 32px rgba(38, 57, 74, 0.10);
      --shadow-lg: 0 24px 60px rgba(38, 57, 74, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans Thai Looped', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      touch-action: pan-y pinch-zoom;
    }

    /* Ambient background gradient like slide-deck */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 18%, rgba(122, 111, 177, 0.12), transparent 28%),
        radial-gradient(circle at 84% 78%, rgba(95, 169, 158, 0.14), transparent 30%);
      z-index: 0;
    }

    /* HEADER BAR */
    header {
      background: rgba(251, 250, 247, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(38, 57, 74, 0.08);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    header.zen-hidden {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      background: var(--ink);
      color: var(--cream);
      font-weight: 700;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 999px;
      font-family: 'Mali', cursive;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(38, 57, 74, 0.2);
    }

    .guide-title {
      font-family: 'Mali', cursive;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
      cursor: pointer;
    }
    .guide-title:hover {
      color: var(--coral);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .view-toggle {
      display: flex;
      background: rgba(38, 57, 74, 0.06);
      border-radius: 999px;
      padding: 3px;
      border: 1px solid rgba(38, 57, 74, 0.08);
    }

    .view-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Mali', cursive;
    }

    .view-btn.active {
      background: var(--card-bg);
      color: var(--ink);
      box-shadow: 0 2px 8px rgba(38, 57, 74, 0.12);
    }

    .btn {
      background: var(--card-bg);
      color: var(--ink);
      border: 1px solid var(--border-dark);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Noto Sans Thai Looped', sans-serif;
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
    }

    .btn:hover {
      background: #F8FAFC;
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: var(--coral);
      border-color: var(--coral);
      color: #FFF;
    }

    .btn-primary:hover {
      background: var(--coral-hover);
      border-color: var(--coral-hover);
      color: #FFF;
    }

    .btn-mint {
      background: var(--mint);
      border-color: var(--mint);
      color: #FFF;
    }
    .btn-mint:hover {
      background: var(--mint-dark);
      border-color: var(--mint-dark);
      color: #FFF;
    }

    /* Floating Unhide / Zen Button */
    #zenToggleFloat {
      position: fixed;
      top: 14px;
      right: 18px;
      z-index: 999;
      background: rgba(38, 57, 74, 0.85);
      color: #FFF;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-family: 'Mali', cursive;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      transition: opacity 0.2s, transform 0.2s;
    }
    #zenToggleFloat:hover {
      background: var(--ink);
      transform: scale(1.04);
    }

    /* SLIDES VIEW */
    #slidesContainer {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .slide-card {
      background: var(--cream);
      border: 1px solid rgba(38, 57, 74, 0.08);
      border-radius: 20px;
      width: 100%;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .slide-header {
      padding: 14px 24px;
      background: #FFFFFF;
      border-bottom: 1px solid rgba(38, 57, 74, 0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .step-badge {
      background: rgba(95, 169, 158, 0.15);
      color: var(--mint-dark);
      border: 1px solid rgba(95, 169, 158, 0.3);
      font-weight: 700;
      font-size: 12px;
      padding: 3px 12px;
      border-radius: 999px;
      font-family: 'Mali', cursive;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .step-text-title {
      font-family: 'Mali', cursive;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      flex: 1;
      outline: none;
      border-radius: 6px;
      padding: 2px 6px;
      transition: background 0.2s;
    }
    .step-text-title:focus {
      background: rgba(232, 135, 122, 0.1);
      box-shadow: 0 0 0 2px var(--coral);
    }

    .header-step-tools {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .icon-btn:hover {
      background: rgba(38, 57, 74, 0.08);
      color: var(--ink);
    }

    /* STAGE VIEWPORT (ZOOM & PAN) */
    .stage-wrapper {
      position: relative;
      width: 100%;
      background: #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-height: 400px;
      height: 65vh;
      max-height: 75vh;
      cursor: grab;
      user-select: none;
    }

    .stage-wrapper:active {
      cursor: grabbing;
    }

    .pan-zoom-content {
      position: relative;
      transform-origin: 0 0;
      transition: transform 0.15s ease-out;
      display: inline-block;
      will-change: transform;
    }

    .pan-zoom-content.smooth-focus {
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .stage-image {
      display: block;
      max-width: 100%;
      height: auto;
      object-fit: contain;
      background: #FFF;
      pointer-events: none;
    }

    /* Floating Zoom Controls */
    .floating-zoom-bar {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: rgba(251, 250, 247, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(38, 57, 74, 0.12);
      border-radius: 999px;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      z-index: 20;
    }

    .zoom-btn {
      background: transparent;
      border: none;
      color: var(--ink);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: background 0.15s;
    }
    .zoom-btn:hover {
      background: rgba(38, 57, 74, 0.1);
    }

    .zoom-level-text {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      min-width: 38px;
      text-align: center;
      font-family: 'Mali', cursive;
    }

    .btn-focus-spotlight {
      background: var(--coral);
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: 'Mali', cursive;
      transition: opacity 0.2s;
    }
    .btn-focus-spotlight:hover {
      opacity: 0.9;
    }

    /* Spotlight marker */
    .spotlight-ring {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }

    .ring-pulse {
      width: 50px;
      height: 50px;
      border: 3.5px solid var(--coral);
      border-radius: 50%;
      background: rgba(232, 135, 122, 0.25);
      box-shadow: 0 0 25px rgba(232, 135, 122, 0.6), inset 0 0 15px rgba(232, 135, 122, 0.4);
      animation: pulse-ring 1.8s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    .ring-center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      background: #FFF;
      border: 2.5px solid var(--coral);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 2px 6px rgba(38, 57, 74, 0.3);
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.9); opacity: 0.95; }
      50% { transform: scale(1.35); opacity: 0.35; }
      100% { transform: scale(0.9); opacity: 0.95; }
    }

    /* Target Box highlight */
    .target-box {
      position: absolute;
      border: 2.5px dashed var(--coral);
      background: rgba(232, 135, 122, 0.12);
      border-radius: 8px;
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(232, 135, 122, 0.25);
    }

    /* Step Custom Note / Tip Callout */
    .slide-note-box {
      padding: 12px 24px;
      background: #FFF;
      border-top: 1px solid rgba(38, 57, 74, 0.06);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--ink);
    }
    .slide-note-box.hidden { display: none; }
    .note-badge {
      background: rgba(210, 165, 75, 0.2);
      color: #946914;
      border: 1px solid rgba(210, 165, 75, 0.4);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Mali', cursive;
      flex-shrink: 0;
    }
    .note-text {
      flex: 1;
      outline: none;
      padding: 2px 4px;
    }
    .note-text:focus {
      background: rgba(210, 165, 75, 0.1);
      border-radius: 4px;
    }
    .note-text:empty::before {
      content: attr(placeholder);
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Slides Controls Bottom Bar */
    .slides-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      background: #FFFFFF;
      border-top: 1px solid rgba(38, 57, 74, 0.06);
      gap: 12px;
    }

    .timeline-bar {
      display: flex;
      gap: 6px;
      flex: 1;
      max-width: 400px;
      margin: 0 16px;
    }

    .timeline-dot {
      flex: 1;
      height: 8px;
      background: rgba(38, 57, 74, 0.1);
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .timeline-dot:hover {
      background: rgba(38, 57, 74, 0.25);
    }

    .timeline-dot.active {
      background: var(--coral);
      box-shadow: 0 2px 6px rgba(232, 135, 122, 0.4);
    }

    /* DOCUMENT VIEW */
    #docContainer {
      display: none;
      max-width: 960px;
      margin: 24px auto;
      padding: 0 16px 60px 16px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .doc-step-card {
      background: var(--cream);
      border: 1px solid rgba(38, 57, 74, 0.08);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 28px;
      box-shadow: var(--shadow-md);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .doc-step-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .doc-step-header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: #FFFFFF;
      border-bottom: 1px solid rgba(38, 57, 74, 0.06);
    }

    .doc-step-title {
      font-family: 'Mali', cursive;
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
    }

    .doc-step-image-wrap {
      position: relative;
      background: #F1F5F9;
    }

    .doc-step-image-wrap img {
      width: 100%;
      display: block;
      background: #FFF;
    }

    /* Modal dialog */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(38, 57, 74, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: #FFF;
      border-radius: 16px;
      padding: 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }
    .modal-title {
      font-family: 'Mali', cursive;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 12px;
    }
    .modal-body input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      margin-bottom: 16px;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--cream);
      border-radius: 20px;
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(38, 57, 74, 0.08);
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .empty-state h2 {
      font-family: 'Mali', cursive;
      color: var(--ink);
      margin-bottom: 12px;
      font-size: 22px;
    }

    /* RESPONSIVE DESIGN (MOBILE & TABLETS) */
    @media (max-width: 768px) {
      header {
        padding: 10px 14px;
      }
      .brand-badge {
        font-size: 11px;
        padding: 3px 8px;
      }
      .guide-title {
        font-size: 15px;
        max-width: 140px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .top-actions {
        gap: 6px;
      }
      .btn {
        padding: 5px 10px;
        font-size: 11px;
      }
      #slidesContainer {
        padding: 8px;
      }
      .slide-card {
        border-radius: 14px;
      }
      .slide-header {
        padding: 10px 14px;
      }
      .step-text-title {
        font-size: 15px;
      }
      .stage-wrapper {
        height: 52vh;
        min-height: 280px;
      }
      .slides-controls {
        padding: 10px 14px;
        flex-wrap: wrap;
      }
      .timeline-bar {
        order: -1;
        width: 100%;
        max-width: 100%;
        margin: 0 0 10px 0;
      }
      .btn-nav-label {
        display: none;
      }
    }

    /* PRINT STYLES (A4 Document Ready) */
    @media print {
      body {
        background: #FFF !important;
        color: #000 !important;
      }
      body::before, header, .slides-controls, .floating-zoom-bar, #zenToggleFloat {
        display: none !important;
      }
      #slidesContainer { display: none !important; }
      #docContainer {
        display: block !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .doc-step-card {
        box-shadow: none !important;
        border: 1px solid #CCC !important;
        page-break-inside: avoid;
        margin-bottom: 20px !important;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Button to Exit Zen/Presentation Mode -->
  <button id="zenToggleFloat" title="คลิกเพื่อแสดงแถบเมนู (หรือกด Z)">
    <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
      <path fill-rule="evenodd" d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8zm15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM8.5 4.5a.5.5 0 0 0-1 0v5.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V4.5z"/>
    </svg>
    แสดงเมนู (Show Menu)
  </button>

  <header id="mainHeader">
    <div class="brand">
      <span class="brand-badge">SCRIBE</span>
      <span class="guide-title" id="displayTitle" title="คลิกเพื่อแก้ไขชื่อคู่มือ">คู่มือการใช้งานระบบ</span>
    </div>

    <div class="top-actions">
      <div class="view-toggle">
        <button class="view-btn active" id="btnViewSlides">
          <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
            <path d="M0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2zm2-1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H2z"/>
          </svg>
          Slides
        </button>
        <button class="view-btn" id="btnViewDoc">
          <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
            <path d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2zM9.5 3A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5v2z"/>
          </svg>
          Doc
        </button>
      </div>

      <button class="btn" id="btnZenMode" title="ซ่อนเมนูเพื่อนำเสนอแบบเต็มจอ (คีย์ลัด Z)">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
          <path d="M1.5 1a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0v-4A1.5 1.5 0 0 1 1.5 0h4a.5.5 0 0 1 0 1h-4zM10 .5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 16 1.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5zM.5 10a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 0 14.5v-4a.5.5 0 0 1 .5-.5zm15 0a.5.5 0 0 1 .5.5v4a1.5 1.5 0 0 1-1.5 1.5h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5z"/>
        </svg>
        Zen Mode
      </button>

      <button class="btn" id="btnPrint" title="พิมพ์เป็นคู่มือเอกสาร A4 หรือบันทึกเป็น PDF">

let currentSession = [];
let sessionMeta = { title: "คู่มือการใช้งานระบบ" };
let currentStepIndex = 0;

// Mode detection: Viewer (Read-only for end users) vs Editor (Extension / Studio)
let isEditMode = false;

// Pan & Zoom State
let zoomScale = 1.0;
let panX = 0;
let panY = 0;
let isPanning = false;
let startPanX = 0;
let startPanY = 0;
let isZenMode = false;

function startApp() {
  // Elements
  const displayTitle = document.getElementById("displayTitle");
  const mainHeader = document.getElementById("mainHeader");
  const zenToggleFloat = document.getElementById("zenToggleFloat");
  const btnZenMode = document.getElementById("btnZenMode");
  const btnPrint = document.getElementById("btnPrint");

  const btnViewSlides = document.getElementById("btnViewSlides");
  const btnViewDoc = document.getElementById("btnViewDoc");
  const slidesContainer = document.getElementById("slidesContainer");
  const docContainer = document.getElementById("docContainer");
  
  const slideStepBadge = document.getElementById("slideStepBadge");
  const slideStepTitle = document.getElementById("slideStepTitle");
  const slideImg = document.getElementById("slideImg");
  const stageWrapper = document.getElementById("stageWrapper");
  const panZoomContent = document.getElementById("panZoomContent");
  const spotlightRing = document.getElementById("spotlightRing");
  const targetBox = document.getElementById("targetBox");
  const timelineBar = document.getElementById("timelineBar");

  const btnZoomIn = document.getElementById("btnZoomIn");
  const btnZoomOut = document.getElementById("btnZoomOut");
  const btnZoomReset = document.getElementById("btnZoomReset");
  const btnFocusSpotlight = document.getElementById("btnFocusSpotlight");
  const zoomLevelText = document.getElementById("zoomLevelText");

  const slideNoteBox = document.getElementById("slideNoteBox");
  const slideNoteText = document.getElementById("slideNoteText");
  const btnToggleTip = document.getElementById("btnToggleTip");
  const btnDeleteStep = document.getElementById("btnDeleteStep");
  const headerStepTools = document.querySelector(".header-step-tools");

  const btnPrev = document.getElementById("btnPrev");
  const btnNext = document.getElementById("btnNext");
  const btnExportHtml = document.getElementById("btnExportHtml");
  const btnImport = document.getElementById("btnImport");
  const fileInput = document.getElementById("fileInput");

  // Title modal
  const titleModal = document.getElementById("titleModal");
  const inputEditTitle = document.getElementById("inputEditTitle");
  const btnCancelEditTitle = document.getElementById("btnCancelEditTitle");
  const btnSaveEditTitle = document.getElementById("btnSaveEditTitle");

  let editListenersInitialized = false;

  // Mode Decision:
  // If it has chrome.runtime and chrome.storage -> In Extension Studio (Allow Editing)
  // If window.__SCRIBE_DATA__ exists -> In Standalone Exported Mode (Allow Editing and Exporting)
  if (window.__SCRIBE_DATA__ && window.__SCRIBE_DATA__.session && window.__SCRIBE_DATA__.session.length > 0) {
    currentSession = window.__SCRIBE_DATA__.session;
    sessionMeta = window.__SCRIBE_DATA__.meta || sessionMeta;
    isEditMode = true; // EDIT / STUDIO MODE
    applyModeUI();
    initViewer();
    setupEditListeners();
  } else if (typeof chrome !== "undefined" && chrome.storage && chrome.storage.local) {
    // Inside Extension Studio: Allow Editing
    chrome.storage.local.get(["currentSession", "sessionMeta"], (res) => {
      if (res.currentSession && res.currentSession.length > 0) {
        currentSession = res.currentSession;
        sessionMeta = res.sessionMeta || sessionMeta;
        isEditMode = true; // EDIT / STUDIO MODE
        applyModeUI();
        initViewer();
        setupEditListeners();
      } else {
        showEmpty();
      }
    });
  } else {
    showEmpty();
  }

  function applyModeUI() {
    if (!isEditMode) {
      // In Read-Only Mode: Lock text and hide authoring tools
      slideStepTitle.removeAttribute("contenteditable");
      slideStepTitle.style.cursor = "default";
      slideStepTitle.removeAttribute("title");

      slideNoteText.removeAttribute("contenteditable");
      slideNoteText.style.cursor = "default";

      displayTitle.style.cursor = "default";
      displayTitle.removeAttribute("title");

      if (headerStepTools) headerStepTools.style.display = "none";
      if (btnImport) btnImport.style.display = "none";
      if (btnExportHtml) btnExportHtml.style.display = "none";
    } else {
      // In Studio Mode: Enable editing tools
      slideStepTitle.setAttribute("contenteditable", "true");
      slideStepTitle.title = "คลิกเพื่อแก้ไขคำอธิบายขั้นตอน";

      slideNoteText.setAttribute("contenteditable", "true");
      displayTitle.title = "คลิกเพื่อแก้ไขชื่อคู่มือ";

      if (headerStepTools) headerStepTools.style.display = "flex";
      if (btnImport) btnImport.style.display = "inline-flex";
      if (btnExportHtml) btnExportHtml.style.display = "inline-flex";
    }
  }

  function showEmpty() {
    displayTitle.textContent = "ยังไม่มีข้อมูลคู่มือ";
    slidesContainer.innerHTML = `
      <div class="empty-state">
        <h2>ยังไม่มีขั้นตอนที่ถูกบันทึก</h2>
        <p style="margin-top: 10px; line-height: 1.6;">เปิดหน้าเว็บที่ต้องการ แล้วกดไอคอน Extension เพื่อเริ่มบันทึก (Start Capture)<br>หรือกดปุ่ม <b>"นำเข้า"</b> ด้านบนเพื่อเปิดดูคู่มือที่มีอยู่</p>
      </div>
    `;
  }

  function initViewer() {
    displayTitle.textContent = sessionMeta.title || "คู่มือการใช้งานระบบ";
    document.title = `${sessionMeta.title || "คู่มือการใช้งานระบบ"} — GuideFlow`;
    currentStepIndex = 0;
    resetZoomAndPan(false);
    renderSlidesTimeline();
    renderSlide(0);
    renderDocView();
  }

  function renderSlidesTimeline() {
    timelineBar.innerHTML = "";
    currentSession.forEach((_, idx) => {
      const dot = document.createElement("div");
      dot.className = `timeline-dot ${idx === currentStepIndex ? "active" : ""}`;
      dot.setAttribute("title", `ขั้นตอนที่ ${idx + 1}`);
      dot.addEventListener("click", () => {
        currentStepIndex = idx;
        renderSlide(idx);
      });
      timelineBar.appendChild(dot);
    });
  }

  function renderSlide(index) {
    if (!currentSession || currentSession.length === 0) return;
    const step = currentSession[index];
    if (!step) return;

    slideStepBadge.textContent = `Step ${index + 1} of ${currentSession.length}`;
    slideStepTitle.textContent = step.description || `ขั้นตอนที่ ${index + 1}`;
    slideImg.src = step.screenshot;

    // Reset zoom when switching step unless zoomed
    resetZoomAndPan(false);

    // Spotlight coordinate
    if (step.coords && step.coords.xPercent !== undefined) {
      spotlightRing.style.display = "block";
      spotlightRing.style.left = `${step.coords.xPercent}%`;
      spotlightRing.style.top = `${step.coords.yPercent}%`;
    } else {
      spotlightRing.style.display = "none";
    }

    // Target box
    if (step.coords && step.coords.box && step.coords.box.width > 0) {
      targetBox.style.display = "block";
      targetBox.style.left = `${step.coords.box.left}%`;
      targetBox.style.top = `${step.coords.box.top}%`;
      targetBox.style.width = `${step.coords.box.width}%`;
      targetBox.style.height = `${step.coords.box.height}%`;
    } else {
      targetBox.style.display = "none";
    }

    // Note / Tip box
    if (step.tipText) {
      slideNoteBox.classList.remove("hidden");
      slideNoteText.textContent = step.tipText;
    } else {
      slideNoteBox.classList.add("hidden");
      slideNoteText.textContent = "";
    }

    // Update timeline
    const dots = timelineBar.querySelectorAll(".timeline-dot");
    dots.forEach((d, i) => d.classList.toggle("active", i === index));

    // Nav button state
    btnPrev.disabled = index === 0;
    btnNext.querySelector(".btn-nav-label").textContent = index === currentSession.length - 1 ? "สิ้นสุด (Finished)" : "ถัดไป (Next)";
  }

  function renderDocView() {
    docContainer.innerHTML = "";
    currentSession.forEach((step, idx) => {
      const card = document.createElement("div");
      card.className = "doc-step-card";

      let ringHtml = "";
      if (step.coords && step.coords.xPercent !== undefined) {
        ringHtml = `
          <div class="spotlight-ring" style="left: ${step.coords.xPercent}%; top: ${step.coords.yPercent}%;">
            <div class="ring-pulse"></div>
            <div class="ring-center-dot"></div>
          </div>
        `;
      }

      let tipHtml = "";
      if (step.tipText) {
        tipHtml = `
          <div style="padding: 10px 20px; background: rgba(210,165,75,0.1); border-top: 1px solid rgba(210,165,75,0.2); font-size: 13px;">
            <b style="color: #946914;">💡 ข้อแนะนำ:</b> ${step.tipText}
          </div>
        `;
      }

      card.innerHTML = `
        <div class="doc-step-header">
          <span class="step-badge">Step ${idx + 1}</span>
          <span class="doc-step-title">${step.description || `ขั้นตอนที่ ${idx + 1}`}</span>
        </div>
        <div class="doc-step-image-wrap">
          <img src="${step.screenshot}" alt="Step ${idx + 1}" />
          ${ringHtml}
        </div>
        ${tipHtml}
      `;
      docContainer.appendChild(card);
    });
  }

  /* --- ZOOM & PAN ENGINE --- */
  function applyTransform(smooth = false) {
    if (smooth) {
      panZoomContent.classList.add("smooth-focus");
      setTimeout(() => panZoomContent.classList.remove("smooth-focus"), 400);
    }
    panZoomContent.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
    zoomLevelText.textContent = `${Math.round(zoomScale * 100)}%`;
  }

  function resetZoomAndPan(smooth = true) {
    zoomScale = 1.0;
    panX = 0;
    panY = 0;
    applyTransform(smooth);
  }

  function zoomAtCenter(delta) {
    const newScale = Math.min(Math.max(0.5, zoomScale + delta), 3.5);
    if (newScale === zoomScale) return;
    
    // Zoom relative to stage center
    const rect = stageWrapper.getBoundingClientRect();
    const cx = rect.width / 2;
    const cy = rect.height / 2;
    
    panX = cx - (cx - panX) * (newScale / zoomScale);
    panY = cy - (cy - panY) * (newScale / zoomScale);
    zoomScale = newScale;
    
    if (zoomScale === 1.0) {
      panX = 0;
      panY = 0;
    }
    applyTransform(false);
  }

  function focusOnSpotlight() {
    const step = currentSession[currentStepIndex];
    if (!step || !step.coords || step.coords.xPercent === undefined) {
      resetZoomAndPan(true);
      return;
    }

    const imgWidth = panZoomContent.offsetWidth || stageWrapper.offsetWidth;
    const imgHeight = panZoomContent.offsetHeight || stageWrapper.offsetHeight;
    const targetX = (step.coords.xPercent / 100) * imgWidth;
    const targetY = (step.coords.yPercent / 100) * imgHeight;

    zoomScale = 1.85; // Focused zoom ratio
    const stageW = stageWrapper.offsetWidth;
    const stageH = stageWrapper.offsetHeight;

    panX = (stageW / 2) - (targetX * zoomScale);
    panY = (stageH / 2) - (targetY * zoomScale);

    applyTransform(true);
  }

  // Zoom Button Events
  btnZoomIn.addEventListener("click", () => zoomAtCenter(0.25));
  btnZoomOut.addEventListener("click", () => zoomAtCenter(-0.25));
  btnZoomReset.addEventListener("click", () => resetZoomAndPan(true));
  btnFocusSpotlight.addEventListener("click", () => focusOnSpotlight());

  // Mouse Wheel Zoom
  stageWrapper.addEventListener("wheel", (e) => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.15 : -0.15;
    
    const rect = stageWrapper.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const newScale = Math.min(Math.max(0.5, zoomScale + delta), 3.5);
    if (newScale !== zoomScale) {
      panX = mouseX - (mouseX - panX) * (newScale / zoomScale);
      panY = mouseY - (mouseY - panY) * (newScale / zoomScale);
      zoomScale = newScale;
      if (zoomScale <= 1.0) {
        panX = 0;
        panY = 0;
      }
      applyTransform(false);
    }
  }, { passive: false });

  // Mouse Drag / Pan
  stageWrapper.addEventListener("mousedown", (e) => {
    if (e.target.closest(".floating-zoom-bar")) return;
    isPanning = true;
    startPanX = e.clientX - panX;
    startPanY = e.clientY - panY;
  });

  window.addEventListener("mousemove", (e) => {
    if (!isPanning) return;
    panX = e.clientX - startPanX;
    panY = e.clientY - startPanY;
    applyTransform(false);
  });

  window.addEventListener("mouseup", () => {
    isPanning = false;
  });

  // Touch Support (Pinch-to-zoom & Swipe gesture for mobile/tablet)
  let initialPinchDistance = 0;
  let initialScale = 1.0;
  let touchStartX = 0;
  let touchStartY = 0;

  stageWrapper.addEventListener("touchstart", (e) => {
    if (e.touches.length === 1) {
      isPanning = true;
      touchStartX = e.touches[0].clientX - panX;
      touchStartY = e.touches[0].clientY - panY;
    } else if (e.touches.length === 2) {
      isPanning = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      initialPinchDistance = Math.hypot(dx, dy);
      initialScale = zoomScale;
    }
  }, { passive: true });

  stageWrapper.addEventListener("touchmove", (e) => {
    if (e.touches.length === 1 && isPanning) {
      panX = e.touches[0].clientX - touchStartX;
      panY = e.touches[0].clientY - touchStartY;
      applyTransform(false);
    } else if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      if (initialPinchDistance > 0) {
        const factor = dist / initialPinchDistance;
        zoomScale = Math.min(Math.max(0.5, initialScale * factor), 3.5);
        applyTransform(false);
      }
    }
  }, { passive: true });

  stageWrapper.addEventListener("touchend", () => {
    isPanning = false;
    initialPinchDistance = 0;
  });

  /* --- ZEN / PRESENTATION MODE --- */
  function toggleZenMode() {
    isZenMode = !isZenMode;
    if (isZenMode) {
      mainHeader.classList.add("zen-hidden");
      zenToggleFloat.style.display = "inline-flex";
    } else {
      mainHeader.classList.remove("zen-hidden");
      zenToggleFloat.style.display = "none";
    }
  }

  btnZenMode.addEventListener("click", toggleZenMode);
  zenToggleFloat.addEventListener("click", toggleZenMode);

  /* --- EDIT STEP TITLE & TIP (Only in Edit Mode) --- */
  function setupEditListeners() {
    if (editListenersInitialized) return;
    editListenersInitialized = true;

    slideStepTitle.addEventListener("blur", () => {
      if (currentSession[currentStepIndex]) {
        currentSession[currentStepIndex].description = slideStepTitle.textContent.trim();
        renderDocView();
        saveToStorage();
      }
    });

    btnToggleTip.addEventListener("click", () => {
      const isHidden = slideNoteBox.classList.contains("hidden");
      if (isHidden) {
        slideNoteBox.classList.remove("hidden");
        slideNoteText.focus();
      } else {
        slideNoteBox.classList.add("hidden");
        if (currentSession[currentStepIndex]) {
          delete currentSession[currentStepIndex].tipText;
          renderDocView();
          saveToStorage();
        }
      }
    });

    slideNoteText.addEventListener("blur", () => {
      if (currentSession[currentStepIndex]) {
        currentSession[currentStepIndex].tipText = slideNoteText.textContent.trim();
        renderDocView();
        saveToStorage();
      }
    });

    btnDeleteStep.addEventListener("click", () => {
      if (currentSession.length <= 1) {
        alert("ไม่สามารถลบขั้นตอนสุดท้ายได้");
        return;
      }
      if (confirm(`คุณต้องการลบขั้นตอนที่ ${currentStepIndex + 1} หรือไม่?`)) {
        currentSession.splice(currentStepIndex, 1);
        if (currentStepIndex >= currentSession.length) {
          currentStepIndex = currentSession.length - 1;
        }
        renderSlidesTimeline();
        renderSlide(currentStepIndex);
        renderDocView();
        saveToStorage();
      }
    });

    /* --- EDIT GUIDE TITLE MODAL --- */
    displayTitle.addEventListener("click", () => {
      inputEditTitle.value = sessionMeta.title || "คู่มือการใช้งานระบบ";
      titleModal.classList.add("open");
      inputEditTitle.focus();
    });

    btnCancelEditTitle.addEventListener("click", () => {
      titleModal.classList.remove("open");
    });

    btnSaveEditTitle.addEventListener("click", () => {
      const newTitle = inputEditTitle.value.trim() || "คู่มือการใช้งานระบบ";
      sessionMeta.title = newTitle;
      displayTitle.textContent = newTitle;
      document.title = `${newTitle} — GuideFlow`;
      titleModal.classList.remove("open");
      saveToStorage();
    });
  }

  function saveToStorage() {
    if (typeof chrome !== "undefined" && chrome.storage && chrome.storage.local) {
      chrome.storage.local.set({ currentSession, sessionMeta });
    }
  }

  // Print button
  btnPrint.addEventListener("click", () => {
    window.print();
  });

  // Navigation
  btnPrev.addEventListener("click", () => {
    if (currentStepIndex > 0) {
      currentStepIndex--;
      renderSlide(currentStepIndex);
    }
  });

  btnNext.addEventListener("click", () => {
    if (currentStepIndex < currentSession.length - 1) {
      currentStepIndex++;
      renderSlide(currentStepIndex);
    }
  });

  // Keyboard navigation
  window.addEventListener("keydown", (e) => {
    // Don't trigger shortcuts if editing text
    if (e.target.isContentEditable || e.target.tagName === "INPUT") return;

    if (e.key === "z" || e.key === "Z") {
      toggleZenMode();
    } else if (e.key === "f" || e.key === "F") {
      focusOnSpotlight();
    } else if (e.key === "r" || e.key === "R" || e.key === "0") {
      resetZoomAndPan(true);
    } else if (e.key === "+" || e.key === "=") {
      zoomAtCenter(0.25);
    } else if (e.key === "-" || e.key === "_") {
      zoomAtCenter(-0.25);
    } else if (slidesContainer.style.display !== "none") {
      if (e.key === "ArrowRight" || e.key === " ") {
        if (currentStepIndex < currentSession.length - 1) {
          currentStepIndex++;
          renderSlide(currentStepIndex);
        }
      } else if (e.key === "ArrowLeft") {
        if (currentStepIndex > 0) {
          currentStepIndex--;
          renderSlide(currentStepIndex);
        }
      }
    }
  });

  // Toggle View modes
  btnViewSlides.addEventListener("click", () => {
    btnViewSlides.classList.add("active");
    btnViewDoc.classList.remove("active");
    slidesContainer.style.display = "flex";
    docContainer.style.display = "none";
  });

  btnViewDoc.addEventListener("click", () => {
    btnViewDoc.classList.add("active");
    btnViewSlides.classList.remove("active");
    slidesContainer.style.display = "none";
    docContainer.style.display = "block";
  });

  // Export standalone HTML
  btnExportHtml.addEventListener("click", () => {
    const bundleData = {
      meta: sessionMeta,
      session: currentSession
    };

    const generateExport = (htmlTemplate, jsCode) => {
      // Escape script tags inside embedded string/json literals so HTML parser won't terminate script early
      const safeDataJson = JSON.stringify(bundleData).split("<" + "/script>").join("<\\/script>");
      const safeJsCode = jsCode.split("<" + "/script>").join("<\\/script>");
      
      const tagScriptOpen = "<" + "script" + ">";
      const tagScriptClose = "<" + "/script" + ">";
      const searchTarget = '<' + 'script src="viewer.js">' + '<' + '/script>';

      const standalone = htmlTemplate.replace(
        searchTarget,
        `${tagScriptOpen}\nwindow.__SCRIBE_DATA__ = ${safeDataJson};\n${safeJsCode}\n${tagScriptClose}`
      );

      const blob = new Blob([standalone], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const filename = (sessionMeta.title || "guide").replace(/[/\\?%*:|"<>]/g, "-") + ".html";
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    if (typeof chrome !== "undefined" && chrome.runtime && chrome.runtime.getURL) {
      fetch(chrome.runtime.getURL("viewer.html"))
        .then(res => res.text())
        .then(html => {
          fetch(chrome.runtime.getURL("viewer.js"))
            .then(jsRes => jsRes.text())
            .then(jsContent => {
              generateExport(html, jsContent);
            });
        });
    } else {
      // In standalone mode, generate full updated standalone HTML
      // In standalone mode, inline script contains viewer logic, so we extract JS or re-fetch template
      fetch(window.location.href)
        .then(res => res.text())
        .then(currentHtml => {
          const safeDataJson = JSON.stringify(bundleData).split("<" + "/script>").join("<\\/script>");
          const tagScriptOpen = "<" + "script" + ">";
          const tagScriptClose = "<" + "/script" + ">";
          
          let standalone = "";
          const scriptRegex = new RegExp("<" + "script" + ">([\\s\\S]*?)<" + "/script" + ">", "i");
          const match = currentHtml.match(scriptRegex);
          if (match) {
            // Extract the JS code part (everything after window.__SCRIBE_DATA__ = ...;)
            let existingJs = match[1];
            const scribeDataRegex = /window\.__SCRIBE_DATA__\s*=\s*[\s\S]*?;\s*/;
            existingJs = existingJs.replace(scribeDataRegex, "");
            
            standalone = currentHtml.replace(
              scriptRegex,
              `${tagScriptOpen}\nwindow.__SCRIBE_DATA__ = ${safeDataJson};\n${existingJs}\n${tagScriptClose}`
            );
          } else {
            standalone = currentHtml;
          }

          const blob = new Blob([standalone], { type: "text/html;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          const filename = (sessionMeta.title || "guide").replace(/[/\\?%*:|"<>]/g, "-") + ".html";
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        });
    }
  });

  // Import JSON
  btnImport.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.session) {
          currentSession = data.session;
          sessionMeta = data.meta || sessionMeta;
        } else if (Array.isArray(data)) {
          currentSession = data;
        }
        initViewer();
        setupEditListeners();
      } catch (err) {
        alert("ไฟล์ JSON ไม่ถูกต้อง");
      }
    };
    reader.readAsText(file);
  });
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", startApp);
} else {
  startApp();
}

</script>
</body>
</html>
