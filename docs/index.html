<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>GuideFlow — Interactive Guide</title>

  <!-- Google Fonts: Mali & Noto Sans Thai Looped -->

  <style>
    :root {
      --ink: #26394A;
      --ink-light: #3E5468;
      --cream: #FBFAF7;
      --lavender: #7A6FB1;
      --mint: #5FA99E;
      --mint-dark: #46867D;
      --coral: #E8877A;
      --coral-hover: #D97365;
      --gold: #D2A54B;
      --sky: #70A7C7;
      --bg: #DCE2E7;
      --card-bg: #FFFFFF;
      --header-bg: rgba(251, 250, 247, 0.94);
      --stage-bg: #E2E8F0;
      --border: #E2E8F0;
      --border-dark: #CBD5E1;
      --text-muted: #64748B;
      --hacker-green: #39FF14;
      --hacker-green-soft: rgba(57, 255, 20, 0.24);
      --hacker-green-glow: rgba(57, 255, 20, 0.72);
      --shadow-sm: 0 4px 12px rgba(38, 57, 74, 0.06);
      --shadow-md: 0 12px 32px rgba(38, 57, 74, 0.10);
      --shadow-lg: 0 24px 60px rgba(38, 57, 74, 0.14);
    }

    body.dark-theme {
      --ink: #E2E8F0;
      --ink-light: #94A3B8;
      --cream: #1E293B;
      --lavender: #9D91D8;
      --mint: #5FA99E;
      --mint-dark: #38B2AC;
      --coral: #FF8A80;
      --coral-hover: #FF7060;
      --gold: #F6C860;
      --sky: #88C0D0;
      --bg: #0F172A;
      --card-bg: #1E293B;
      --header-bg: rgba(30, 41, 59, 0.94);
      --stage-bg: #0B1120;
      --border: #334155;
      --border-dark: #475569;
      --text-muted: #94A3B8;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans Thai Looped', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      touch-action: pan-y pinch-zoom;
    }

    /* Ambient background gradient like slide-deck */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 18%, rgba(122, 111, 177, 0.12), transparent 28%),
        radial-gradient(circle at 84% 78%, rgba(95, 169, 158, 0.14), transparent 30%);
      z-index: 0;
    }

    body.dark-theme::before {
      background:
        radial-gradient(circle at 15% 18%, rgba(157, 145, 216, 0.08), transparent 28%),
        radial-gradient(circle at 84% 78%, rgba(95, 169, 158, 0.09), transparent 30%);
    }

    /* HEADER BAR */
    header {
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    header.zen-hidden {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      background: var(--ink);
      color: var(--cream);
      font-weight: 700;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 999px;
      font-family: 'Mali', cursive;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(38, 57, 74, 0.2);
    }

    .guide-title {
      font-family: 'Mali', cursive;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
      cursor: pointer;
    }

    .guide-title:hover {
      color: var(--coral);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .view-toggle {
      display: flex;
      background: rgba(38, 57, 74, 0.06);
      border-radius: 999px;
      padding: 3px;
      border: 1px solid rgba(38, 57, 74, 0.08);
    }

    .view-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Mali', cursive;
    }

    .view-btn.active {
      background: var(--card-bg);
      color: var(--ink);
      box-shadow: 0 2px 8px rgba(38, 57, 74, 0.12);
    }

    .btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--ink);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Noto Sans Thai Looped', sans-serif;
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--border);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: var(--coral);
      border-color: var(--coral);
      color: #FFF;
    }

    .btn-primary:hover {
      background: var(--coral-hover);
      border-color: var(--coral-hover);
      color: #FFF;
    }

    .btn-mint {
      background: var(--mint);
      border-color: var(--mint);
      color: #FFF;
    }

    .btn-mint:hover {
      background: var(--mint-dark);
      border-color: var(--mint-dark);
      color: #FFF;
    }

    /* Floating Unhide / Zen Button */
    #zenToggleFloat {
      position: fixed;
      top: 14px;
      right: 18px;
      z-index: 999;
      background: rgba(38, 57, 74, 0.85);
      color: #FFF;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-family: 'Mali', cursive;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      transition: opacity 0.2s, transform 0.2s;
    }

    #zenToggleFloat:hover {
      background: var(--ink);
      transform: scale(1.04);
    }

    /* SLIDES VIEW */
    #slidesContainer {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      max-width: min(1680px, 96vw);
      margin: 0 auto;
      width: 100%;
      height: calc(100dvh - 72px);
      min-height: 0;
      position: relative;
      z-index: 1;
      transition: max-width 0.3s ease, padding 0.3s ease;
    }

    body.zen-active #slidesContainer {
      max-width: 98vw;
      padding: 8px 12px;
      height: 100dvh;
    }

    .slide-card {
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .slide-header {
      padding: 14px 24px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .step-badge {
      background: rgba(95, 169, 158, 0.15);
      color: var(--mint-dark);
      border: 1px solid rgba(95, 169, 158, 0.3);
      font-weight: 700;
      font-size: 12px;
      padding: 3px 12px;
      border-radius: 999px;
      font-family: 'Mali', cursive;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .step-text-title {
      font-family: 'Mali', cursive;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      flex: 1;
      outline: none;
      border-radius: 6px;
      padding: 2px 6px;
      transition: background 0.2s;
    }

    .step-text-title:focus {
      background: rgba(232, 135, 122, 0.1);
      box-shadow: 0 0 0 2px var(--coral);
    }

    .header-step-tools {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: rgba(38, 57, 74, 0.08);
      color: var(--ink);
    }

    /* STAGE VIEWPORT (ZOOM & PAN) */
    .stage-wrapper {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 240px;
      height: 100%;
      background: var(--stage-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: grab;
      user-select: none;
    }

    .stage-wrapper:active {
      cursor: grabbing;
    }

    .pan-zoom-content {
      position: relative;
      transform-origin: 0 0;
      transition: transform 0.15s ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      max-height: 100%;
      will-change: transform;
    }

    .pan-zoom-content.smooth-focus {
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .stage-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      background: #FFF;
      pointer-events: none;
    }

    /* Floating Zoom Controls */
    .floating-zoom-bar {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: var(--header-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-md);
      z-index: 20;
    }

    .zoom-btn {
      background: transparent;
      border: none;
      color: var(--ink);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: background 0.15s;
    }

    .zoom-btn:hover {
      background: rgba(38, 57, 74, 0.1);
    }

    .zoom-level-text {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      min-width: 38px;
      text-align: center;
      font-family: 'Mali', cursive;
    }

    .btn-focus-spotlight {
      background: var(--coral);
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: 'Mali', cursive;
      transition: all 0.2s;
    }

    .btn-focus-spotlight:hover {
      opacity: 0.9;
    }

    .focus-color-picker-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .focus-color-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid white;
      cursor: pointer;
      box-shadow: 0 0 4px rgba(0,0,0,0.3);
      padding: 0;
      background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .focus-color-btn:hover {
      transform: scale(1.15);
      box-shadow: 0 0 8px rgba(0,0,0,0.4);
    }

    .focus-color-palette {
      display: none;
      position: absolute;
      bottom: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      z-index: 50;
      align-items: center;
      justify-content: center;
    }

    .focus-color-palette.open {
      display: flex;
    }

    .color-swatch-ring {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .color-swatch {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      transition: transform 0.15s;
    }

    .color-swatch:hover {
      transform: translate(-50%, -50%) scale(1.25) !important;
      z-index: 5;
    }

    .color-swatch.active {
      border-color: var(--ink);
      box-shadow: 0 0 0 2px var(--mint), 0 2px 6px rgba(0,0,0,0.4);
      transform: translate(-50%, -50%) scale(1.18) !important;
    }

    .color-swatch-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--border);
      box-shadow: inset 0 0 6px rgba(0,0,0,0.2);
    }

    .btn-toggle-spotlight {
      background: var(--card-bg);
      color: var(--ink);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: 'Mali', cursive;
      transition: all 0.2s;
    }

    .btn-toggle-spotlight:hover {
      background: var(--border);
    }

    .btn-toggle-spotlight.off {
      opacity: 0.6;
      border-style: dashed;
    }

    .btn-auto-focus {
      background: var(--card-bg);
      color: var(--ink);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: 'Mali', cursive;
      transition: all 0.2s;
    }

    .btn-auto-focus:hover {
      background: var(--border);
    }

    .btn-auto-focus.active {
      background: var(--mint-dark);
      border-color: var(--mint-dark);
      color: #FFFFFF;
      box-shadow: 0 0 10px rgba(70, 134, 125, 0.4);
    }

    /* Spotlight marker */
    :root {
      --spotlight-color: var(--hacker-green);
      --spotlight-soft: var(--hacker-green-soft);
      --spotlight-glow: var(--hacker-green-glow);
    }

    .spotlight-ring {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }

    .ring-pulse {
      width: 50px;
      height: 50px;
      border: 3.5px solid var(--spotlight-color);
      border-radius: 50%;
      background: var(--spotlight-soft);
      box-shadow: 0 0 25px var(--spotlight-glow), inset 0 0 15px var(--spotlight-soft);
      animation: pulse-ring 1.8s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    .ring-center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      background: #FFF;
      border: 2.5px solid var(--spotlight-color);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px var(--spotlight-glow);
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.9);
        opacity: 0.95;
      }

      50% {
        transform: scale(1.35);
        opacity: 0.35;
      }

      100% {
        transform: scale(0.9);
        opacity: 0.95;
      }
    }

    /* Target Box highlight */
    .target-box {
      position: absolute;
      border: 2.5px dashed var(--spotlight-color);
      background: var(--spotlight-soft);
      border-radius: 8px;
      pointer-events: none;
      box-shadow: 0 0 18px var(--spotlight-glow);
    }

    /* Step Custom Note / Tip Callout */
    .slide-note-box {
      padding: 12px 24px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--ink);
    }

    .slide-note-box.hidden {
      display: none;
    }

    .note-badge {
      background: rgba(210, 165, 75, 0.2);
      color: var(--gold);
      border: 1px solid rgba(210, 165, 75, 0.4);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Mali', cursive;
      flex-shrink: 0;
    }

    .note-text {
      flex: 1;
      outline: none;
      padding: 2px 4px;
    }

    .note-text:focus {
      background: rgba(210, 165, 75, 0.1);
      border-radius: 4px;
    }

    .note-text:empty::before {
      content: attr(placeholder);
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Slides Controls Bottom Bar */
    .slides-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      gap: 12px;
    }

    .timeline-bar {
      display: flex;
      gap: 6px;
      flex: 1;
      max-width: 400px;
      margin: 0 16px;
    }

    .timeline-dot {
      flex: 1;
      height: 8px;
      background: rgba(148, 163, 184, 0.25);
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .timeline-dot:hover {
      background: rgba(148, 163, 184, 0.45);
    }

    .timeline-dot.active {
      background: var(--coral);
      box-shadow: 0 2px 6px rgba(232, 135, 122, 0.4);
    }

    /* DOCUMENT VIEW */
    #docContainer {
      display: none;
      max-width: min(1360px, 94vw);
      margin: 24px auto;
      padding: 0 16px 60px 16px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .doc-step-card {
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 28px;
      box-shadow: var(--shadow-md);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .doc-step-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .doc-step-header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }

    .doc-step-title {
      font-family: 'Mali', cursive;
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
    }

    .doc-step-image-wrap {
      position: relative;
      background: var(--stage-bg);
    }

    .doc-step-image-wrap img {
      width: 100%;
      display: block;
      background: #FFF;
    }

    /* Modal dialog */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }

    .modal-title {
      font-family: 'Mali', cursive;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 12px;
    }

    .modal-body input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      margin-bottom: 16px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--cream);
      border-radius: 20px;
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(38, 57, 74, 0.08);
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .empty-state h2 {
      font-family: 'Mali', cursive;
      color: var(--ink);
      margin-bottom: 12px;
      font-size: 22px;
    }

    /* RESPONSIVE DESIGN (MOBILE & TABLETS) */
    @media (max-width: 768px) {
      header {
        padding: 10px 14px;
      }

      .brand-badge {
        font-size: 11px;
        padding: 3px 8px;
      }

      .guide-title {
        font-size: 15px;
        max-width: 140px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .top-actions {
        gap: 6px;
      }

      .btn {
        padding: 5px 10px;
        font-size: 11px;
      }

      #slidesContainer {
        padding: 8px;
        height: calc(100dvh - 60px);
        max-width: 100%;
      }

      .slide-card {
        border-radius: 14px;
      }

      .slide-header {
        padding: 10px 14px;
      }

      .step-text-title {
        font-size: 15px;
      }

      .stage-wrapper {
        min-height: 220px;
      }

      .slides-controls {
        padding: 10px 14px;
        flex-wrap: wrap;
      }

      .timeline-bar {
        order: -1;
        width: 100%;
        max-width: 100%;
        margin: 0 0 10px 0;
      }

      .btn-nav-label {
        display: none;
      }
    }

    /* PRINT STYLES (A4 Document Ready) */
    @media print {
      body {
        background: #FFF !important;
        color: #000 !important;
      }

      body::before,
      header,
      .slides-controls,
      .floating-zoom-bar,
      #zenToggleFloat {
        display: none !important;
      }

      #slidesContainer {
        display: none !important;
      }

      #docContainer {
        display: block !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .doc-step-card {
        box-shadow: none !important;
        border: 1px solid #CCC !important;
        page-break-inside: avoid;
        margin-bottom: 20px !important;
      }

      .spotlight-ring {
        opacity: 1 !important;
      }

      .spotlight-ring .ring-pulse {
        border-color: rgba(57, 255, 20, 1) !important;
        background: rgba(57, 255, 20, 0.30) !important;
        box-shadow: none !important;
        animation: none !important;
      }

      .target-box {
        opacity: 1 !important;
        border-color: rgba(57, 255, 20, 1) !important;
        background: rgba(57, 255, 20, 0.30) !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>

      </div>

  <div class="modal-overlay" id="exportImagesModal">

        <p style="font-size: 13px; color: var(--text-muted); line-height: 1.5;">

          <select id="selExportResolution" style="padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main); font-size: 14px; outline: none; cursor: pointer;">
            <option value="original">Original (ขนาดจริงตามหน้าจอ)</option>
            <option value="2k">2K Quad HD (2560px Wide)</option>
            <option value="4k" selected>4K Ultra HD (3840px Wide - คมชัดสูงพิเศษ)</option>

        </div>
        <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; user-select: none;">

        <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; user-select: none;">

      </div>
      <div class="modal-actions">
        <button class="btn" id="btnCancelExportImages">ยกเลิก</button>
        <button class="btn btn-primary" id="btnConfirmExportImages">เลือกโฟลเดอร์ &amp; บันทึก</button>
      </div>

  // envelope and serialization overhead when moving a bundle between pages.
  const MAX_TOTAL_BYTES = 48 * 1024 * 1024;
  const MAX_TEXT_LENGTH = 4000;
  const MAX_TITLE_LENGTH = 200;
  const MAX_IMAGES_PER_STEP = 200;
  const MAX_IMAGE_DATA_URL_BYTES = 32 * 1024 * 1024;
  const OWN = Object.prototype.hasOwnProperty;

  const IMAGE_DATA_URL_RE = /^data:image\/(png|jpeg|webp|gif);base64,([A-Za-z0-9+/]+={0,2})$/i;

  function hasOwn(value, key) {
    return value !== null && value !== undefined && OWN.call(value, key);
  }

  function invalid(message) {
    throw new TypeError(`Invalid GuideFlow data: ${message}`);
  }

  function isPlainRecord(value) {
    if (value === null || typeof value !== "object") return false;
    const proto = Object.getPrototypeOf(value);
    return proto === Object.prototype || proto === null;
  }

  function byteLength(value) {
    if (typeof TextEncoder !== "undefined") {
      return new TextEncoder().encode(value).byteLength;
    }
    if (typeof Buffer !== "undefined" && typeof Buffer.byteLength === "function") {
      return Buffer.byteLength(value, "utf8");
    }
    // The fallback is only used by older extension runtimes without either
    // standard byte counter.  It still counts UTF-8 code points correctly for
    // the characters GuideFlow accepts.
    return unescape(encodeURIComponent(value)).length;
  }

  function serializedInput(input) {
    let serialized;
    try {
      serialized = JSON.stringify(input);
    } catch (_) {
      invalid("bundle must be JSON serializable");
    }
    if (typeof serialized !== "string") invalid("bundle must be an object or array");
    if (byteLength(serialized) > MAX_TOTAL_BYTES) invalid("bundle exceeds the size limit");
    return serialized;
  }

  function cleanText(value, field, maxLength = MAX_TEXT_LENGTH) {
    if (value === undefined) return undefined;
    if (typeof value !== "string") invalid(`${field} must be text`);
    if (value.length > maxLength) invalid(`${field} exceeds the length limit`);
    return value;
  }

  function cleanNumber(value, field, { min = -Infinity, max = Infinity } = {}) {
    if (typeof value !== "number" || !Number.isFinite(value)) {
      invalid(`${field} must be finite`);
    }
    if (value < min || value > max) invalid(`${field} is out of range`);
    return value;
  }

  function cleanOptionalNumber(source, output, key, options) {
    if (hasOwn(source, key)) output[key] = cleanNumber(source[key], key, options);
  }

  function safeImageUrl(value) {
    if (typeof value !== "string") invalid("image must be a data URL");
    if (byteLength(value) > MAX_IMAGE_DATA_URL_BYTES) invalid("image exceeds the size limit");
    const match = IMAGE_DATA_URL_RE.exec(value);
    if (!match) invalid("image must be a PNG, JPEG, WebP, or GIF data URL");
    const payload = match[2];
    if (payload.length === 0 || payload.length % 4 !== 0) {
      invalid("image base64 payload is malformed");
    }
    return value;
  }

  function cleanBox(value, field) {
    if (!isPlainRecord(value)) invalid(`${field} must be an object`);
    const raw = {};
    for (const key of ["top", "left", "width", "height"]) {
      if (hasOwn(value, key)) raw[key] = cleanNumber(value[key], `${field}.${key}`, { min: key === "width" || key === "height" ? 0 : -Number.MAX_SAFE_INTEGER, max: Number.MAX_SAFE_INTEGER });
    }
    if (Object.keys(raw).length === 0) invalid(`${field} must contain coordinates`);
    // Older recorders measured unclipped element rectangles. A partly offscreen
    // element can legitimately have negative positions or exceed the viewport.
    const clip = number => Math.max(0, Math.min(100, number));
    const output = {};
    if (hasOwn(raw, "left")) output.left = clip(raw.left);
    if (hasOwn(raw, "top")) output.top = clip(raw.top);
    if (hasOwn(raw, "width")) output.width = Math.max(0, clip((raw.left || 0) + raw.width) - clip(raw.left || 0));
    if (hasOwn(raw, "height")) output.height = Math.max(0, clip((raw.top || 0) + raw.height) - clip(raw.top || 0));
    return output;
  }

  function cleanCoords(value) {
    if (value === null) return null;
    if (!isPlainRecord(value)) invalid("coords must be an object or null");
    const output = {};
    if (hasOwn(value, "xPercent")) output.xPercent = cleanNumber(value.xPercent, "coords.xPercent", { min: 0, max: 100 });
    if (hasOwn(value, "yPercent")) output.yPercent = cleanNumber(value.yPercent, "coords.yPercent", { min: 0, max: 100 });
    if (hasOwn(value, "box")) {
      output.box = value.box === null ? null : cleanBox(value.box, "coords.box");
    }
    if (Object.keys(output).length === 0) invalid("coords must contain coordinates");
    return output;
  }

  function cleanDocumentCoords(value) {
    if (value === null) return null;
    if (!isPlainRecord(value)) invalid("documentCoords must be an object or null");
    const output = {};
    if (hasOwn(value, "x")) output.x = cleanNumber(value.x, "documentCoords.x");
    if (hasOwn(value, "y")) output.y = cleanNumber(value.y, "documentCoords.y");
    if (hasOwn(value, "box")) {
      if (value.box === null) {
        output.box = null;
      } else {
        if (!isPlainRecord(value.box)) invalid("documentCoords.box must be an object");
        const box = {};
        if (hasOwn(value.box, "left")) box.left = cleanNumber(value.box.left, "documentCoords.box.left");
        if (hasOwn(value.box, "top")) box.top = cleanNumber(value.box.top, "documentCoords.box.top");
        if (hasOwn(value.box, "width")) box.width = cleanNumber(value.box.width, "documentCoords.box.width", { min: 0 });
        if (hasOwn(value.box, "height")) box.height = cleanNumber(value.box.height, "documentCoords.box.height", { min: 0 });
        if (Object.keys(box).length === 0) invalid("documentCoords.box must contain coordinates");
        output.box = box;
      }
    }
    if (Object.keys(output).length === 0) invalid("documentCoords must contain coordinates");
    return output;
  }

  function cleanViewport(value) {
    if (value === null) return null;
    if (!isPlainRecord(value)) invalid("viewport must be an object or null");
    const output = {};
    if (hasOwn(value, "width")) output.width = cleanNumber(value.width, "viewport.width", { min: 0 });
    if (hasOwn(value, "height")) output.height = cleanNumber(value.height, "viewport.height", { min: 0 });
    if (hasOwn(value, "dpr")) output.dpr = cleanNumber(value.dpr, "viewport.dpr", { min: 0 });
    if (hasOwn(value, "scrollHeight")) output.scrollHeight = cleanNumber(value.scrollHeight, "viewport.scrollHeight", { min: 0 });
    if (hasOwn(value, "scrollWidth")) output.scrollWidth = cleanNumber(value.scrollWidth, "viewport.scrollWidth", { min: 0 });
    if (hasOwn(value, "scrollX")) output.scrollX = cleanNumber(value.scrollX, "viewport.scrollX", { min: 0 });
    if (hasOwn(value, "scrollY")) output.scrollY = cleanNumber(value.scrollY, "viewport.scrollY", { min: 0 });
    if (Object.keys(output).length === 0) invalid("viewport must contain dimensions");
    return output;
  }

  function cleanImageGeometry(value) {
    if (value === null) return null;
    if (!isPlainRecord(value)) invalid("imageGeometry must be an object or null");
    const output = {};
    // Keep the geometry contract intentionally small.  Additional fields are
    // ignored rather than copied from an untrusted object.
    if (hasOwn(value, "width")) output.width = cleanNumber(value.width, "imageGeometry.width", { min: 0 });
    if (hasOwn(value, "height")) output.height = cleanNumber(value.height, "imageGeometry.height", { min: 0 });
    if (Object.keys(output).length === 0) invalid("imageGeometry must contain dimensions");
    return output;
  }

  function cleanMeta(value) {
    if (value === undefined) return {};
    if (!isPlainRecord(value)) invalid("meta must be an object");
    const output = {};
    if (hasOwn(value, "title")) output.title = cleanText(value.title, "title", MAX_TITLE_LENGTH);
    if (hasOwn(value, "startTime")) output.startTime = cleanNumber(value.startTime, "meta.startTime", { min: 0 });
    if (hasOwn(value, "captureMode")) output.captureMode = cleanText(value.captureMode, "meta.captureMode", 200);
    if (hasOwn(value, "url")) output.url = cleanText(value.url, "meta.url");
    if (hasOwn(value, "pageTitle")) output.pageTitle = cleanText(value.pageTitle, "meta.pageTitle");
    if (hasOwn(value, "action")) output.action = cleanText(value.action, "meta.action");
    if (hasOwn(value, "description")) output.description = cleanText(value.description, "meta.description");
    if (hasOwn(value, "viewport")) output.viewport = cleanViewport(value.viewport);
    if (hasOwn(value, "coords")) output.coords = cleanCoords(value.coords);
    if (hasOwn(value, "documentCoords")) output.documentCoords = cleanDocumentCoords(value.documentCoords);
    if (hasOwn(value, "imageGeometry")) output.imageGeometry = cleanImageGeometry(value.imageGeometry);
    return output;
  }

  function cleanStep(value, index, meta) {
    if (!isPlainRecord(value)) invalid(`session[${index}] must be an object`);
    const output = {};
    let recognized = false;

    if (hasOwn(value, "id")) {
      output.id = cleanText(value.id, `session[${index}].id`, 200);
      if (!output.id) invalid(`session[${index}].id must not be empty`);
      recognized = true;
    }
    if (hasOwn(value, "timestamp")) {
      output.timestamp = cleanNumber(value.timestamp, `session[${index}].timestamp`, { min: 0 });
      recognized = true;
    }

    const textFields = [
      "url", "pageTitle", "action", "elementTag", "elementText", "description", "tipText", "captureMode"
    ];
    for (const field of textFields) {
      if (hasOwn(value, field)) {
        output[field] = cleanText(value[field], `session[${index}].${field}`);
        recognized = true;
      }
    }

    if (hasOwn(value, "coords")) {
      output.coords = cleanCoords(value.coords);
      recognized = true;
    }
    if (hasOwn(value, "documentCoords")) {
      output.documentCoords = cleanDocumentCoords(value.documentCoords);
      recognized = true;
    }
    if (hasOwn(value, "viewport")) {
      output.viewport = cleanViewport(value.viewport);
      recognized = true;
    }
    if (hasOwn(value, "imageGeometry")) {
      output.imageGeometry = cleanImageGeometry(value.imageGeometry);
      recognized = true;
    }
    if (hasOwn(value, "screenshot")) {
      output.screenshot = safeImageUrl(value.screenshot);
      recognized = true;
    }
    if (hasOwn(value, "screenshots")) {
      if (!Array.isArray(value.screenshots)) invalid(`session[${index}].screenshots must be an array`);
      if (value.screenshots.length > MAX_IMAGES_PER_STEP) invalid(`session[${index}] has too many images`);
      output.screenshots = value.screenshots.map((image) => safeImageUrl(image));
      recognized = true;
    }

    if (!recognized) invalid(`session[${index}] has no supported fields`);
    if (!output.screenshot && output.screenshots?.length) output.screenshot = output.screenshots[0];
    if (!output.screenshot) invalid(`session[${index}] requires a screenshot`);

    if (!hasOwn(output, "id")) {
      const timestamp = hasOwn(output, "timestamp")
        ? output.timestamp
        : (typeof meta.startTime === "number" ? meta.startTime : 0);
      output.id = `step_${timestamp}_${index}`;
    }
    return output;
  }

  function validateBundle(input) {
    serializedInput(input);
    let source = input;
    if (Array.isArray(source)) {
      source = { meta: {}, session: source };
    }
    if (!isPlainRecord(source)) invalid("bundle must be an object or legacy array");

    if (hasOwn(source, "schemaVersion") && source.schemaVersion !== 1) {
      invalid("unsupported schema version");
    }
    if (!hasOwn(source, "session")) invalid("session is required");
    if (!Array.isArray(source.session)) invalid("session must be an array");
    if (source.session.length > MAX_STEPS) invalid("too many steps");

    const meta = cleanMeta(source.meta);
    const session = source.session.map((step, index) => cleanStep(step, index, meta));
    if (new Set(session.map(step => step.id)).size !== session.length) invalid("duplicate step id");
    return { schemaVersion: 1, meta, session };
  }

  function serializeForHtml(data) {
    const clean = validateBundle(data);
    let json;
    try {
      json = JSON.stringify(clean);
    } catch (_) {
      invalid("bundle must be JSON serializable");
    }
    return json
      .replace(/</g, "\\u003c")
      .replace(/>/g, "\\u003e")
      .replace(/&/g, "\\u0026")
      .replace(/\u2028/g, "\\u2028")
      .replace(/\u2029/g, "\\u2029");
  }

  return {
    validateBundle,
    serializeForHtml,
    safeImageUrl,
    limits: Object.freeze({
      maxSteps: MAX_STEPS,
      maxTotalBytes: MAX_TOTAL_BYTES,
      maxTextLength: MAX_TEXT_LENGTH,
      maxTitleLength: MAX_TITLE_LENGTH,
      maxImagesPerStep: MAX_IMAGES_PER_STEP,
      maxImageDataUrlBytes: MAX_IMAGE_DATA_URL_BYTES
    })
  };
});

// Data remains separate from executable viewer code; replacement callbacks preserve $ tokens.
function createStandaloneExport(htmlTemplate, runtimeJs, bundle) {
  const safeData = GuideFlowData.serializeForHtml(GuideFlowData.validateBundle(bundle));
  const dataTag = '<script id="guideflow-data" type="application/json">' + safeData + '<' + '/script>';
  const safeCode = runtimeJs.replace(/<\/script/gi, "<\\/script");
  const runtimeTag = '<script id="guideflow-runtime">' + safeCode + '<' + '/script>';
  const dataPattern = /<script\b[^>]*id=["']guideflow-data["'][^>]*>[\s\S]*?<\/script\s*>/i;
  const runtimePattern = /<script\b[^>]*id=["']guideflow-runtime["'][^>]*>[\s\S]*?<\/script\s*>/i;
  let html = htmlTemplate.replace(/<script\b[^>]*src=["']guide-data\.js["'][^>]*>\s*<\/script\s*>/i, "");
  html = html.replace(/<script\b[^>]*id=["']guideflow-demo-data["'][^>]*>[\s\S]*?<\/script\s*>/i, "");
  html = html.replace(dataPattern, "");
  if (runtimePattern.test(html)) return html.replace(runtimePattern, () => dataTag + runtimeTag);
  return html.replace(/<script\b[^>]*src=["']viewer\.js["'][^>]*>\s*<\/script\s*>/i, () => dataTag + runtimeTag);
}

async function hydrateDemoAssets(input) {
  const bundle = JSON.parse(JSON.stringify(input));
  const cache = new Map();
  async function image(value) {
    if (typeof value !== "string" || !value.startsWith("assets/")) return GuideFlowData.safeImageUrl(value);
    const match = /^assets\/demo-([a-f0-9]{64})\.(png|jpeg|webp|gif)$/.exec(value);
    if (!match) throw new Error("Invalid demo image asset");
    if (!cache.has(value)) cache.set(value, (async () => {
      const response = await fetch(value);
      if (!response.ok) throw new Error("Demo image asset could not be loaded");
      const buffer = await response.arrayBuffer();
      const hash = Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", buffer)), byte => byte.toString(16).padStart(2, "0")).join("");
      if (hash !== match[1]) throw new Error("Demo image integrity check failed");
      const bytes = new Uint8Array(buffer);
      let binary = "";
      for (let offset = 0; offset < bytes.length; offset += 32768) binary += String.fromCharCode(...bytes.subarray(offset, offset + 32768));
      return GuideFlowData.safeImageUrl(`data:image/${match[2]};base64,` + btoa(binary));
    })());
    return cache.get(value);
  }
  for (const step of bundle.session) {
    step.screenshot = await image(step.screenshot);
    if (step.screenshots) step.screenshots = await Promise.all(step.screenshots.map(image));
  }
  return GuideFlowData.validateBundle(bundle);
}

      else resolve(response);

  function initViewer() {
    slideImg.style.display = "";
    displayTitle.textContent = sessionMeta.title || "คู่มือการใช้งานระบบ";
    document.title = `${sessionMeta.title || "คู่มือการใช้งานระบบ"} — GuideFlow`;

  function renderSlidesTimeline() {
    timelineBar.replaceChildren();
    currentSession.forEach((_, idx) => {
      const dot = document.createElement("div");
      dot.className = `timeline-dot ${idx === currentStepIndex ? "active" : ""}`;

  function renderSlide(index) {
    if (!currentSession || currentSession.length === 0) return;
    const step = currentSession[index];
    if (!step) return;

    if (isSingleCaptureMode) {
      slideStepBadge.textContent = "ภาพแคปหน้าจอ (Screenshot)";
      if (headerStepTools) headerStepTools.style.display = "none";
    } else {
      slideStepBadge.textContent = `Step ${index + 1} of ${currentSession.length}`;
    }
    slideStepTitle.textContent = step.description || `ขั้นตอนที่ ${index + 1}`;
    slideImg.src = step.screenshot;

    // Spotlight coordinate
    if (isSpotlightVisible && step.coords && step.coords.xPercent !== undefined) {
      spotlightRing.style.display = "block";
      spotlightRing.style.left = `${step.coords.xPercent}%`;
      spotlightRing.style.top = `${step.coords.yPercent}%`;
    } else {
      spotlightRing.style.display = "none";
    }

    // Auto Focus logic if enabled
    if (isAutoFocusActive && step.coords && step.coords.xPercent !== undefined) {
      requestAnimationFrame(() => {
        focusOnSpotlight(false);
      });
    } else {
      // Reset zoom when switching step in normal mode
      resetZoomAndPan(false);
    }

    // Target box
    if (isSpotlightVisible && step.coords && step.coords.box && step.coords.box.width > 0) {
      targetBox.style.display = "block";
      targetBox.style.left = `${step.coords.box.left}%`;
      targetBox.style.top = `${step.coords.box.top}%`;
      targetBox.style.width = `${step.coords.box.width}%`;
      targetBox.style.height = `${step.coords.box.height}%`;
    } else {
      targetBox.style.display = "none";
    }

    // Note / Tip box
    if (step.tipText) {
      slideNoteBox.classList.remove("hidden");
      slideNoteText.textContent = step.tipText;
    } else {
      slideNoteBox.classList.add("hidden");
      slideNoteText.textContent = "";
    }

    // Update timeline
    const dots = timelineBar.querySelectorAll(".timeline-dot");
    dots.forEach((d, i) => d.classList.toggle("active", i === index));

    // Nav button state
    btnPrev.disabled = index === 0;
    btnNext.querySelector(".btn-nav-label").textContent = index === currentSession.length - 1 ? "สิ้นสุด (Finished)" : "ถัดไป (Next)";
  }

  function renderDocView() {
    docContainer.replaceChildren();
    currentSession.forEach((step, idx) => {
      const card = document.createElement("div"); card.className = "doc-step-card";
      const header = document.createElement("div"); header.className = "doc-step-header";
      const badge = document.createElement("span"); badge.className = "step-badge"; badge.textContent = `Step ${idx + 1}`;
      const title = document.createElement("span"); title.className = "doc-step-title"; title.textContent = step.description || `ขั้นตอนที่ ${idx + 1}`;
      header.append(badge, title);
      const wrap = document.createElement("div"); wrap.className = "doc-step-image-wrap";

        wrap.appendChild(img);

      if (isSpotlightVisible && step.coords && step.coords.xPercent !== undefined) {

      card.append(header, wrap);

      docContainer.appendChild(card);

  function applyTransform(smooth = false) {
    if (smooth) {
      panZoomContent.classList.add("smooth-focus");
      setTimeout(() => panZoomContent.classList.remove("smooth-focus"), 400);
    }
    panZoomContent.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
    zoomLevelText.textContent = `${Math.round(zoomScale * 100)}%`;
  }

  function resetZoomAndPan(smooth = true) {
    zoomScale = 1.0;
    panX = 0;
    panY = 0;
    applyTransform(smooth);
  }

  function zoomAtCenter(delta) {
    const newScale = Math.min(Math.max(0.5, zoomScale + delta), 3.5);
    if (newScale === zoomScale) return;
    
    // Zoom relative to stage center
    const rect = stageWrapper.getBoundingClientRect();
    const cx = rect.width / 2;
    const cy = rect.height / 2;
    
    panX = cx - (cx - panX) * (newScale / zoomScale);
    panY = cy - (cy - panY) * (newScale / zoomScale);
    zoomScale = newScale;
    
    if (zoomScale === 1.0) {
      panX = 0;
      panY = 0;
    }
    applyTransform(false);
  }

  function focusOnSpotlight(smooth = true) {
    const step = currentSession[currentStepIndex];
    if (!step || !step.coords || step.coords.xPercent === undefined) {
      resetZoomAndPan(smooth);
      return;
    }

    const imgWidth = panZoomContent.offsetWidth || stageWrapper.offsetWidth;
    const imgHeight = panZoomContent.offsetHeight || stageWrapper.offsetHeight;
    const targetX = (step.coords.xPercent / 100) * imgWidth;
    const targetY = (step.coords.yPercent / 100) * imgHeight;

    zoomScale = 1.85; // Focused zoom ratio
    const stageW = stageWrapper.offsetWidth;
    const stageH = stageWrapper.offsetHeight;

    panX = (stageW / 2) - (targetX * zoomScale);
    panY = (stageH / 2) - (targetY * zoomScale);

    applyTransform(smooth);
  }

  function toggleAutoFocus() {
    isAutoFocusActive = !isAutoFocusActive;
    if (isAutoFocusActive) {
      btnAutoFocus.classList.add("active");

    } else {

  // Focus Spotlight Color Ring Picker
  function positionSwatchesInRing() {
    const swatches = focusColorPalette.querySelectorAll(".color-swatch");
    const radius = 50; // pixels from center (ring radius)
    const center = 70; // 140px width / 2
    swatches.forEach(swatch => {
      const angleDeg = parseFloat(swatch.dataset.angle) || 0;
      const angleRad = (angleDeg - 90) * (Math.PI / 180);
      const x = center + radius * Math.cos(angleRad);
      const y = center + radius * Math.sin(angleRad);
      swatch.style.left = `${x}px`;
      swatch.style.top = `${y}px`;
      swatch.style.transform = "translate(-50%, -50%)";
    });
  }

  function setSpotlightColor(hexColor) {
    document.documentElement.style.setProperty("--spotlight-color", hexColor);
    
    // Parse hex to rgba
    let c = hexColor.replace("#", "");
    if (c.length === 3) c = c.split("").map(x => x + x).join("");
    const num = parseInt(c, 16);
    const r = (num >> 16) & 255;
    const g = (num >> 8) & 255;
    const b = num & 255;
    
    document.documentElement.style.setProperty("--spotlight-soft", `rgba(${r}, ${g}, ${b}, 0.24)`);
    document.documentElement.style.setProperty("--spotlight-glow", `rgba(${r}, ${g}, ${b}, 0.72)`);
    
    const colorSwatchCenter = document.getElementById("colorSwatchCenter");
    if (colorSwatchCenter) {
      colorSwatchCenter.style.background = hexColor;
    }
    
    localStorage.setItem("guideflow_spotlight_color", hexColor);

    if (focusColorPalette) {
      focusColorPalette.querySelectorAll(".color-swatch").forEach(swatch => {
        swatch.classList.toggle("active", swatch.dataset.color.toLowerCase() === hexColor.toLowerCase());
      });
    }
  }

  // Mouse Wheel Zoom
  stageWrapper.addEventListener("wheel", (e) => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.15 : -0.15;
    
    const rect = stageWrapper.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const newScale = Math.min(Math.max(0.5, zoomScale + delta), 3.5);
    if (newScale !== zoomScale) {
      panX = mouseX - (mouseX - panX) * (newScale / zoomScale);
      panY = mouseY - (mouseY - panY) * (newScale / zoomScale);
      zoomScale = newScale;
      if (zoomScale <= 1.0) {
        panX = 0;
        panY = 0;
      }
      applyTransform(false);
    }
  }, { passive: false });

  // Mouse Drag / Pan
  stageWrapper.addEventListener("mousedown", (e) => {
    if (e.target.closest(".floating-zoom-bar")) return;
    isPanning = true;
    startPanX = e.clientX - panX;
    startPanY = e.clientY - panY;
  });

  window.addEventListener("mousemove", (e) => {
    if (!isPanning) return;
    panX = e.clientX - startPanX;
    panY = e.clientY - startPanY;
    applyTransform(false);
  });

  window.addEventListener("mouseup", () => {
    isPanning = false;
  });

  // Touch Support (Pinch-to-zoom & Swipe gesture for mobile/tablet)
  let initialPinchDistance = 0;
  let initialScale = 1.0;
  let touchStartX = 0;
  let touchStartY = 0;

  stageWrapper.addEventListener("touchstart", (e) => {
    if (e.touches.length === 1) {
      isPanning = true;
      touchStartX = e.touches[0].clientX - panX;
      touchStartY = e.touches[0].clientY - panY;
    } else if (e.touches.length === 2) {
      isPanning = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      initialPinchDistance = Math.hypot(dx, dy);
      initialScale = zoomScale;
    }
  }, { passive: true });

  stageWrapper.addEventListener("touchmove", (e) => {
    if (e.touches.length === 1 && isPanning) {
      panX = e.touches[0].clientX - touchStartX;
      panY = e.touches[0].clientY - touchStartY;
      applyTransform(false);
    } else if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      if (initialPinchDistance > 0) {
        const factor = dist / initialPinchDistance;
        zoomScale = Math.min(Math.max(0.5, initialScale * factor), 3.5);
        applyTransform(false);
      }
    }
  }, { passive: true });

  stageWrapper.addEventListener("touchend", () => {
    isPanning = false;
    initialPinchDistance = 0;
  });

  function saveToStorage(override, importing = false) {
    let bundle;
    try { bundle = GuideFlowData.validateBundle(override || { meta: sessionMeta, session: currentSession }); }
    catch (error) { showToast(error.message); return Promise.reject(error); }
    if (!isExtension) { window.__SCRIBE_DATA__ = bundle; return Promise.resolve(bundle); }
    const recordingId = guideRecordingId;
    pendingSaves++;
    const save = saveQueue.then(async () => {
      const result = await guideMessage({ type: "SAVE_GUIDE", bundle, expectedRevision: guideRevision, recordingId, importing });
      guideRevision = result.revision; guideRecordingId = result.recordingId;
      return bundle;
    });
    saveQueue = save.catch(async error => {
      showToast(error.message);
      await reloadGuide().catch(() => {});
    }).finally(() => { pendingSaves--; });
    return save;
  }

  async function renderHighlightedImage(dataUrl, step, resolution = "original") {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        let targetWidth = img.naturalWidth || img.width;
        let targetHeight = img.naturalHeight || img.height;

        if (resolution === "4k") {
          const scale = 3840 / targetWidth;
          if (scale > 1) {
            targetWidth = 3840;
            targetHeight = Math.round(targetHeight * scale);
          }
        } else if (resolution === "2k") {
          const scale = 2560 / targetWidth;
          if (scale > 1) {
            targetWidth = 2560;
            targetHeight = Math.round(targetHeight * scale);
          }
        }

        const canvas = document.createElement("canvas");
        canvas.width = targetWidth;
        canvas.height = targetHeight;
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";

        // Draw original screenshot scaled
        ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

        if (step.coords && step.coords.xPercent !== undefined) {
          const x = (step.coords.xPercent / 100) * canvas.width;
          const y = (step.coords.yPercent / 100) * canvas.height;

          // Draw target box if present
          if (step.coords.box && step.coords.box.width > 0) {
            const bx = (step.coords.box.left / 100) * canvas.width;
            const by = (step.coords.box.top / 100) * canvas.height;
            const bw = (step.coords.box.width / 100) * canvas.width;
            const bh = (step.coords.box.height / 100) * canvas.height;

            ctx.save();
            ctx.strokeStyle = "#39FF14";
            ctx.lineWidth = Math.max(3, canvas.width * 0.0025);
            ctx.setLineDash([8, 6]);
            ctx.fillStyle = "rgba(57, 255, 20, 0.12)";
            ctx.fillRect(bx, by, bw, bh);
            ctx.strokeRect(bx, by, bw, bh);
            ctx.restore();
          }

          // Draw Hacker Green pulse ring
          ctx.save();
          const ringRadius = Math.max(22, canvas.width * 0.022);
          ctx.beginPath();
          ctx.arc(x, y, ringRadius, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(57, 255, 20, 0.25)";
          ctx.fill();
          ctx.strokeStyle = "#39FF14";
          ctx.lineWidth = Math.max(3.5, canvas.width * 0.0035);
          ctx.shadowColor = "rgba(57, 255, 20, 0.8)";
          ctx.shadowBlur = 15;
          ctx.stroke();

          // Center dot
          ctx.beginPath();
          ctx.arc(x, y, Math.max(6, ringRadius * 0.26), 0, Math.PI * 2);
          ctx.fillStyle = "#FFFFFF";
          ctx.fill();
          ctx.strokeStyle = "#39FF14";
          ctx.lineWidth = 2.5;
          ctx.stroke();
          ctx.restore();
        }

        canvas.toBlob((blob) => resolve(blob), "image/png");
      };
      img.onerror = () => {
        // Fallback to dataURL blob if image load fails
        fetch(dataUrl).then(res => res.blob()).then(resolve);
      };
      img.src = dataUrl;
    });
  }

  async function dataUrlToBlob(dataUrl, resolution = "original") {
    if (resolution === "original") {
      const res = await fetch(dataUrl);
      return await res.blob();
    }
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        let targetWidth = img.naturalWidth || img.width;
        let targetHeight = img.naturalHeight || img.height;

        if (resolution === "4k") {
          const scale = 3840 / targetWidth;
          if (scale > 1) {
            targetWidth = 3840;
            targetHeight = Math.round(targetHeight * scale);
          }
        } else if (resolution === "2k") {
          const scale = 2560 / targetWidth;
          if (scale > 1) {
            targetWidth = 2560;
            targetHeight = Math.round(targetHeight * scale);
          }
        }

        const canvas = document.createElement("canvas");
        canvas.width = targetWidth;
        canvas.height = targetHeight;
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
        canvas.toBlob((blob) => resolve(blob), "image/png");
      };
      img.onerror = () => {
        fetch(dataUrl).then(res => res.blob()).then(resolve);
      };
      img.src = dataUrl;
    });
  }

  async function exportImagesToDirectory(dirHandle, includeHighlight, includeReadme, resolution = "original") {
    for (let i = 0; i < currentSession.length; i++) {
      const step = currentSession[i];
      const stepNum = String(i + 1).padStart(2, "0");
      const safeDesc = (step.description || "action")
        .replace(/[/\\?%*:|"<>]/g, "-")
        .replace(/\s+/g, "_")
        .substring(0, 30);

      const screenshots = Array.isArray(step.screenshots) && step.screenshots.length
        ? step.screenshots
        : [step.screenshot];

      for (let sIdx = 0; sIdx < screenshots.length; sIdx++) {
        const shotUrl = screenshots[sIdx];
        const partSuffix = screenshots.length > 1 ? `_part${sIdx + 1}` : "";
        const fileName = `step-${stepNum}_${safeDesc}${partSuffix}.png`;

        let blob;
        if (includeHighlight && sIdx === 0) {
          blob = await renderHighlightedImage(shotUrl, step, resolution);
        } else {
          blob = await dataUrlToBlob(shotUrl, resolution);
        }

        const fileHandle = await dirHandle.getFileHandle(fileName, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(blob);
        await writable.close();
      }
    }

    if (includeReadme) {
      let mdContent = `# ${sessionMeta.title || "คู่มือการใช้งานระบบ"}\n\n`;
      mdContent += `สร้างเมื่อ: ${new Date(sessionMeta.startTime || Date.now()).toLocaleString("th-TH")}\n\n`;
      mdContent += `## ขั้นตอนการดำเนินงาน\n\n`;

      currentSession.forEach((step, idx) => {
        const stepNum = String(idx + 1).padStart(2, "0");
        mdContent += `### ขั้นตอนที่ ${idx + 1}: ${step.description || "คลิกบนหน้าจอ"}\n`;
        if (step.url) mdContent += `- **URL:** ${step.url}\n`;
        if (step.tipText) mdContent += `- **ข้อแนะนำ:** 💡 ${step.tipText}\n`;
        mdContent += `\n`;
      });

      const readmeHandle = await dirHandle.getFileHandle("README.md", { create: true });
      const writable = await readmeHandle.createWritable();
      await writable.write(new Blob([mdContent], { type: "text/markdown;charset=utf-8" }));
      await writable.close();
    }
  }

  async function exportImagesFallback(includeHighlight, includeReadme, resolution = "original") {
    for (let i = 0; i < currentSession.length; i++) {
      const step = currentSession[i];
      const stepNum = String(i + 1).padStart(2, "0");
      const safeDesc = (step.description || "action")
        .replace(/[/\\?%*:|"<>]/g, "-")
        .replace(/\s+/g, "_")
        .substring(0, 30);

      const screenshots = Array.isArray(step.screenshots) && step.screenshots.length
        ? step.screenshots
        : [step.screenshot];

      for (let sIdx = 0; sIdx < screenshots.length; sIdx++) {
        const partSuffix = screenshots.length > 1 ? `_part${sIdx + 1}` : "";
        const fileName = `step-${stepNum}_${safeDesc}${partSuffix}.png`;
        let blob = includeHighlight && sIdx === 0
          ? await renderHighlightedImage(screenshots[sIdx], step, resolution)
          : await dataUrlToBlob(screenshots[sIdx], resolution);

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        await new Promise(r => setTimeout(r, 150));
      }
    }
  }

  // Export standalone HTML
  btnExportHtml.addEventListener("click", () => {
    const bundleData = {
      meta: sessionMeta,
      session: currentSession
    };

    const generateExport = (htmlTemplate, jsCode) => {
      const standalone = createStandaloneExport(htmlTemplate, jsCode, bundleData);
      const blob = new Blob([standalone], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = (sessionMeta.title || "guide").replace(/[/\\?%*:|"<>]/g, "-") + ".html";
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    };

    if (isExtension) {
      Promise.all(["viewer.html", "guide-data.js", "viewer.js"].map(file => fetch(chrome.runtime.getURL(file)).then(response => { if (!response.ok) throw new Error("Unable to load export template"); return response.text(); })))
        .then(([html, dataJs, viewerJs]) => generateExport(html, dataJs + "\n" + viewerJs))
        .catch(error => showToast(error.message));
    } else {
      const runtime = document.getElementById("guideflow-runtime");
      if (!runtime) { showToast("เปิดคู่มือนี้ใน GuideFlow แล้วส่งออกใหม่เพื่ออัปเดตรูปแบบไฟล์"); return; }
      generateExport(document.documentElement.outerHTML, runtime.textContent);
    }
  });


  // Export JSON Backup
  btnExportJson.addEventListener("click", () => {
    if (!currentSession || currentSession.length === 0) {
      alert("ไม่มีข้อมูลขั้นตอนที่จะส่งออก");
      return;
    }
    const bundleData = {
      meta: sessionMeta,
      session: currentSession
    };
    const jsonStr = JSON.stringify(bundleData, null, 2);
    const blob = new Blob([jsonStr], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const filename = (sessionMeta.title || "guide-backup").replace(/[/\\?%*:|"<>]/g, "-") + ".json";
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // Import JSON
  btnImport.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", async e => {
    const file = e.target.files[0];
    if (!file) return;
    const originalRevision = guideRevision, originalRecordingId = guideRecordingId;
    try {
      if (file.size > 48 * 1024 * 1024) throw new Error("ไฟล์ใหญ่เกิน 48 MB");
      const bundle = GuideFlowData.validateBundle(JSON.parse(await file.text()));
      const imageUrls = new Set(bundle.session.flatMap(step => [step.screenshot, ...(step.screenshots || [])]));
      if (imageUrls.size > 2000) throw new Error("จำนวนภาพมากเกินไป");
      for (const url of imageUrls) {
        const bitmap = await createImageBitmap(await (await fetch(url)).blob());
        try {
          if (bitmap.width > 32767 || bitmap.height > 32767 || bitmap.width * bitmap.height > 64000000) throw new Error("ภาพมีขนาดใหญ่เกินไป");
        } finally { bitmap.close(); }
      }
      if (isExtension && (guideRevision !== originalRevision || guideRecordingId !== originalRecordingId)) throw new Error("คู่มือเปลี่ยนระหว่างนำเข้า กรุณาลองใหม่");
      await saveToStorage(bundle, true);
      currentSession = bundle.session; sessionMeta = bundle.meta; isEditMode = true;
      applyModeUI();
      if (currentSession.length) initViewer(); else showEmpty();
      setupEditListeners(); showToast("นำเข้าและบันทึกคู่มือแล้ว");
    } catch (error) { showToast("นำเข้าไม่สำเร็จ: " + error.message); }
    finally { fileInput.value = ""; }
  });

}

function bootGuideFlow() {
  const packaged = document.getElementById("guideflow-demo-data");
  if (!packaged) { startApp(); return; }
  hydrateDemoAssets(JSON.parse(packaged.textContent)).then(bundle => { window.__SCRIBE_DATA__ = bundle; startApp(); })
    .catch(error => { document.body.textContent = "ไม่สามารถเปิดคู่มือตัวอย่าง: " + error.message; });
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bootGuideFlow);
else bootGuideFlow();
</script>
