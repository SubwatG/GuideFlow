<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>GuideFlow — Interactive Guide</title>

  <!-- Google Fonts: Mali & Noto Sans Thai Looped -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Noto+Sans+Thai+Looped:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --ink: #26394A;
      --ink-light: #3E5468;
      --cream: #FBFAF7;
      --lavender: #7A6FB1;
      --mint: #5FA99E;
      --mint-dark: #46867D;
      --coral: #E8877A;
      --coral-hover: #D97365;
      --gold: #D2A54B;
      --sky: #70A7C7;
      --bg: #DCE2E7;
      --card-bg: #FFFFFF;
      --header-bg: rgba(251, 250, 247, 0.94);
      --stage-bg: #E2E8F0;
      --border: #E2E8F0;
      --border-dark: #CBD5E1;
      --text-muted: #64748B;
      --hacker-green: #39FF14;
      --hacker-green-soft: rgba(57, 255, 20, 0.24);
      --hacker-green-glow: rgba(57, 255, 20, 0.72);
      --shadow-sm: 0 4px 12px rgba(38, 57, 74, 0.06);
      --shadow-md: 0 12px 32px rgba(38, 57, 74, 0.10);
      --shadow-lg: 0 24px 60px rgba(38, 57, 74, 0.14);
    }

    body.dark-theme {
      --ink: #E2E8F0;
      --ink-light: #94A3B8;
      --cream: #1E293B;
      --lavender: #9D91D8;
      --mint: #5FA99E;
      --mint-dark: #38B2AC;
      --coral: #FF8A80;
      --coral-hover: #FF7060;
      --gold: #F6C860;
      --sky: #88C0D0;
      --bg: #0F172A;
      --card-bg: #1E293B;
      --header-bg: rgba(30, 41, 59, 0.94);
      --stage-bg: #0B1120;
      --border: #334155;
      --border-dark: #475569;
      --text-muted: #94A3B8;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans Thai Looped', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      touch-action: pan-y pinch-zoom;
    }

    /* Ambient background gradient like slide-deck */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 18%, rgba(122, 111, 177, 0.12), transparent 28%),
        radial-gradient(circle at 84% 78%, rgba(95, 169, 158, 0.14), transparent 30%);
      z-index: 0;
    }

    body.dark-theme::before {
      background:
        radial-gradient(circle at 15% 18%, rgba(157, 145, 216, 0.08), transparent 28%),
        radial-gradient(circle at 84% 78%, rgba(95, 169, 158, 0.09), transparent 30%);
    }

    /* HEADER BAR */
    header {
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    header.zen-hidden {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      background: var(--ink);
      color: var(--cream);
      font-weight: 700;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 999px;
      font-family: 'Mali', cursive;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(38, 57, 74, 0.2);
    }

    .guide-title {
      font-family: 'Mali', cursive;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
      cursor: pointer;
    }

    .guide-title:hover {
      color: var(--coral);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .view-toggle {
      display: flex;
      background: rgba(38, 57, 74, 0.06);
      border-radius: 999px;
      padding: 3px;
      border: 1px solid rgba(38, 57, 74, 0.08);
    }

    .view-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Mali', cursive;
    }

    .view-btn.active {
      background: var(--card-bg);
      color: var(--ink);
      box-shadow: 0 2px 8px rgba(38, 57, 74, 0.12);
    }

    .btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--ink);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Noto Sans Thai Looped', sans-serif;
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--border);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: var(--coral);
      border-color: var(--coral);
      color: #FFF;
    }

    .btn-primary:hover {
      background: var(--coral-hover);
      border-color: var(--coral-hover);
      color: #FFF;
    }

    .btn-mint {
      background: var(--mint);
      border-color: var(--mint);
      color: #FFF;
    }

    .btn-mint:hover {
      background: var(--mint-dark);
      border-color: var(--mint-dark);
      color: #FFF;
    }

    /* Floating Unhide / Zen Button */
    #zenToggleFloat {
      position: fixed;
      top: 14px;
      right: 18px;
      z-index: 999;
      background: rgba(38, 57, 74, 0.85);
      color: #FFF;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-family: 'Mali', cursive;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      transition: opacity 0.2s, transform 0.2s;
    }

    #zenToggleFloat:hover {
      background: var(--ink);
      transform: scale(1.04);
    }

    /* SLIDES VIEW */
    #slidesContainer {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      max-width: min(1680px, 96vw);
      margin: 0 auto;
      width: 100%;
      height: calc(100dvh - 72px);
      min-height: 0;
      position: relative;
      z-index: 1;
      transition: max-width 0.3s ease, padding 0.3s ease;
    }

    body.zen-active #slidesContainer {
      max-width: 98vw;
      padding: 8px 12px;
      height: 100dvh;
    }

    .slide-card {
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .slide-header {
      padding: 14px 24px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .step-badge {
      background: rgba(95, 169, 158, 0.15);
      color: var(--mint-dark);
      border: 1px solid rgba(95, 169, 158, 0.3);
      font-weight: 700;
      font-size: 12px;
      padding: 3px 12px;
      border-radius: 999px;
      font-family: 'Mali', cursive;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .step-text-title {
      font-family: 'Mali', cursive;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      flex: 1;
      outline: none;
      border-radius: 6px;
      padding: 2px 6px;
      transition: background 0.2s;
    }

    .step-text-title:focus {
      background: rgba(232, 135, 122, 0.1);
      box-shadow: 0 0 0 2px var(--coral);
    }

    .header-step-tools {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: rgba(38, 57, 74, 0.08);
      color: var(--ink);
    }

    /* STAGE VIEWPORT (ZOOM & PAN) */
    .stage-wrapper {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 240px;
      height: 100%;
      background: var(--stage-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: grab;
      user-select: none;
    }

    .stage-wrapper:active {
      cursor: grabbing;
    }

    .pan-zoom-content {
      position: relative;
      transform-origin: 0 0;
      transition: transform 0.15s ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      max-height: 100%;
      will-change: transform;
    }

    .pan-zoom-content.smooth-focus {
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .stage-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      background: #FFF;
      pointer-events: none;
    }

    /* Floating Zoom Controls */
    .floating-zoom-bar {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: var(--header-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-md);
      z-index: 20;
    }

    .zoom-btn {
      background: transparent;
      border: none;
      color: var(--ink);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: background 0.15s;
    }

    .zoom-btn:hover {
      background: rgba(38, 57, 74, 0.1);
    }

    .zoom-level-text {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      min-width: 38px;
      text-align: center;
      font-family: 'Mali', cursive;
    }

    .btn-focus-spotlight {
      background: var(--coral);
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: 'Mali', cursive;
      transition: all 0.2s;
    }

    .btn-focus-spotlight:hover {
      opacity: 0.9;
    }

    .focus-color-picker-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .focus-color-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid white;
      cursor: pointer;
      box-shadow: 0 0 4px rgba(0,0,0,0.3);
      padding: 0;
      background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .focus-color-btn:hover {
      transform: scale(1.15);
      box-shadow: 0 0 8px rgba(0,0,0,0.4);
    }

    .focus-color-palette {
      display: none;
      position: absolute;
      bottom: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      z-index: 50;
      align-items: center;
      justify-content: center;
    }

    .focus-color-palette.open {
      display: flex;
    }

    .color-swatch-ring {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .color-swatch {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      transition: transform 0.15s;
    }

    .color-swatch:hover {
      transform: translate(-50%, -50%) scale(1.25) !important;
      z-index: 5;
    }

    .color-swatch.active {
      border-color: var(--ink);
      box-shadow: 0 0 0 2px var(--mint), 0 2px 6px rgba(0,0,0,0.4);
      transform: translate(-50%, -50%) scale(1.18) !important;
    }

    .color-swatch-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--border);
      box-shadow: inset 0 0 6px rgba(0,0,0,0.2);
    }

    .btn-toggle-spotlight {
      background: var(--card-bg);
      color: var(--ink);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: 'Mali', cursive;
      transition: all 0.2s;
    }

    .btn-toggle-spotlight:hover {
      background: var(--border);
    }

    .btn-toggle-spotlight.off {
      opacity: 0.6;
      border-style: dashed;
    }

    .btn-auto-focus {
      background: var(--card-bg);
      color: var(--ink);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: 'Mali', cursive;
      transition: all 0.2s;
    }

    .btn-auto-focus:hover {
      background: var(--border);
    }

    .btn-auto-focus.active {
      background: var(--mint-dark);
      border-color: var(--mint-dark);
      color: #FFFFFF;
      box-shadow: 0 0 10px rgba(70, 134, 125, 0.4);
    }

    /* Spotlight marker */
    :root {
      --spotlight-color: var(--hacker-green);
      --spotlight-soft: var(--hacker-green-soft);
      --spotlight-glow: var(--hacker-green-glow);
    }

    .spotlight-ring {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }

    .ring-pulse {
      width: 50px;
      height: 50px;
      border: 3.5px solid var(--spotlight-color);
      border-radius: 50%;
      background: var(--spotlight-soft);
      box-shadow: 0 0 25px var(--spotlight-glow), inset 0 0 15px var(--spotlight-soft);
      animation: pulse-ring 1.8s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    .ring-center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      background: #FFF;
      border: 2.5px solid var(--spotlight-color);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px var(--spotlight-glow);
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.9);
        opacity: 0.95;
      }

      50% {
        transform: scale(1.35);
        opacity: 0.35;
      }

      100% {
        transform: scale(0.9);
        opacity: 0.95;
      }
    }

    /* Target Box highlight */
    .target-box {
      position: absolute;
      border: 2.5px dashed var(--spotlight-color);
      background: var(--spotlight-soft);
      border-radius: 8px;
      pointer-events: none;
      box-shadow: 0 0 18px var(--spotlight-glow);
    }

    /* Step Custom Note / Tip Callout */
    .slide-note-box {
      padding: 12px 24px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--ink);
    }

    .slide-note-box.hidden {
      display: none;
    }

    .note-badge {
      background: rgba(210, 165, 75, 0.2);
      color: var(--gold);
      border: 1px solid rgba(210, 165, 75, 0.4);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Mali', cursive;
      flex-shrink: 0;
    }

    .note-text {
      flex: 1;
      outline: none;
      padding: 2px 4px;
    }

    .note-text:focus {
      background: rgba(210, 165, 75, 0.1);
      border-radius: 4px;
    }

    .note-text:empty::before {
      content: attr(placeholder);
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Slides Controls Bottom Bar */
    .slides-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      gap: 12px;
    }

    .timeline-bar {
      display: flex;
      gap: 6px;
      flex: 1;
      max-width: 400px;
      margin: 0 16px;
    }

    .timeline-dot {
      flex: 1;
      height: 8px;
      background: rgba(148, 163, 184, 0.25);
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .timeline-dot:hover {
      background: rgba(148, 163, 184, 0.45);
    }

    .timeline-dot.active {
      background: var(--coral);
      box-shadow: 0 2px 6px rgba(232, 135, 122, 0.4);
    }

    /* DOCUMENT VIEW */
    #docContainer {
      display: none;
      max-width: min(1360px, 94vw);
      margin: 24px auto;
      padding: 0 16px 60px 16px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .doc-step-card {
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 28px;
      box-shadow: var(--shadow-md);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .doc-step-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .doc-step-header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }

    .doc-step-title {
      font-family: 'Mali', cursive;
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
    }

    .doc-step-image-wrap {
      position: relative;
      background: var(--stage-bg);
    }

    .doc-step-image-wrap img {
      width: 100%;
      display: block;
      background: #FFF;
    }

    /* Modal dialog */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }

    .modal-title {
      font-family: 'Mali', cursive;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 12px;
    }

    .modal-body input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      margin-bottom: 16px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--cream);
      border-radius: 20px;
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(38, 57, 74, 0.08);
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .empty-state h2 {
      font-family: 'Mali', cursive;
      color: var(--ink);
      margin-bottom: 12px;
      font-size: 22px;
    }

    /* RESPONSIVE DESIGN (MOBILE & TABLETS) */
    @media (max-width: 768px) {
      header {
        padding: 10px 14px;
      }

      .brand-badge {
        font-size: 11px;
        padding: 3px 8px;
      }

      .guide-title {
        font-size: 15px;
        max-width: 140px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .top-actions {
        gap: 6px;
      }

      .btn {
        padding: 5px 10px;
        font-size: 11px;
      }

      #slidesContainer {
        padding: 8px;
        height: calc(100dvh - 60px);
        max-width: 100%;
      }

      .slide-card {
        border-radius: 14px;
      }

      .slide-header {
        padding: 10px 14px;
      }

      .step-text-title {
        font-size: 15px;
      }

      .stage-wrapper {
        min-height: 220px;
      }

      .slides-controls {
        padding: 10px 14px;
        flex-wrap: wrap;
      }

      .timeline-bar {
        order: -1;
        width: 100%;
        max-width: 100%;
        margin: 0 0 10px 0;
      }

      .btn-nav-label {
        display: none;
      }
    }

    /* PRINT STYLES (A4 Document Ready) */
    @media print {
      body {
        background: #FFF !important;
        color: #000 !important;
      }

      body::before,
      header,
      .slides-controls,
      .floating-zoom-bar,
      #zenToggleFloat {
        display: none !important;
      }

      #slidesContainer {
        display: none !important;
      }

      #docContainer {
        display: block !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .doc-step-card {
        box-shadow: none !important;
        border: 1px solid #CCC !important;
        page-break-inside: avoid;
        margin-bottom: 20px !important;
      }

      .spotlight-ring {
        opacity: 1 !important;
      }

      .spotlight-ring .ring-pulse {
        border-color: rgba(57, 255, 20, 1) !important;
        background: rgba(57, 255, 20, 0.30) !important;
        box-shadow: none !important;
        animation: none !important;
      }

      .target-box {
        opacity: 1 !important;
        border-color: rgba(57, 255, 20, 1) !important;
        background: rgba(57, 255, 20, 0.30) !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>

<body>

  <!-- Floating Button to Exit Zen/Presentation Mode -->
  <button id="zenToggleFloat" title="คลิกเพื่อแสดงแถบเมนู (หรือกด Z)">
    <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
      <path fill-rule="evenodd"
        d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8zm15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM8.5 4.5a.5.5 0 0 0-1 0v5.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V4.5z" />
    </svg>
    แสดงเมนู (Show Menu)
  </button>

  <header id="mainHeader">
    <div class="brand">
      <span class="brand-badge">GUIDEFLOW</span>
      <span class="guide-title" id="displayTitle" title="คลิกเพื่อแก้ไขชื่อคู่มือ">คู่มือการใช้งานระบบ</span>
    </div>

    <div class="top-actions">
      <div class="view-toggle">
        <button class="view-btn active" id="btnViewSlides">
          <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
            <path
              d="M0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2zm2-1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H2z" />
          </svg>
          Slides
        </button>
        <button class="view-btn" id="btnViewDoc">
          <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
            <path
              d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2zM9.5 3A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5v2z" />
          </svg>
          Doc
        </button>
      </div>

      <button class="btn" id="btnZenMode" title="ซ่อนเมนูเพื่อนำเสนอแบบเต็มจอ (คีย์ลัด Z)">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
          <path
            d="M1.5 1a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0v-4A1.5 1.5 0 0 1 1.5 0h4a.5.5 0 0 1 0 1h-4zM10 .5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 16 1.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5zM.5 10a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 0 14.5v-4a.5.5 0 0 1 .5-.5zm15 0a.5.5 0 0 1 .5.5v4a1.5 1.5 0 0 1-1.5 1.5h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5z" />
        </svg>
        Zen Mode
      </button>

      <button class="btn" id="btnPrint" title="พิมพ์เป็นคู่มือเอกสาร A4 หรือบันทึกเป็น PDF">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
          <path d="M2.5 8a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z" />
          <path
            d="M5 1a2 2 0 0 0-2 2v2H2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1v1a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1h1a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1V3a2 2 0 0 0-2-2H5zM4 3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2H4V3zm1 5a2 2 0 0 0-2 2v1H2a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v-1a2 2 0 0 0-2-2H5zm7 2v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1z" />
        </svg>
        พิมพ์/PDF
      </button>

      <button class="btn" id="btnImport" title="นำเข้าไฟล์ข้อมูลคู่มือ (.json) เพื่อเปิดดูหรือแก้ไข">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
          <path
            d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z" />
          <path
            d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z" />
        </svg>
        นำเข้า JSON
      </button>

      <button class="btn" id="btnExportJson" title="ส่งออกไฟล์ข้อมูลคู่มือ (.json) เพื่อสำรองข้อมูลหรือแชร์">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
          <path d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5L14 4.5zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5h-2z"/>
          <path d="M4.5 9.5a.5.5 0 0 1 .5-.5h6a.5.5 0 0 1 0 1h-6a.5.5 0 0 1-.5-.5zm0 2a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 0 1h-4a.5.5 0 0 1-.5-.5z"/>
        </svg>
        Export JSON
      </button>

      <button class="btn" id="btnExportImages" title="ส่งออกรูปภาพทุกขั้นตอนลงโฟลเดอร์ในเครื่อง">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
          <path d="M4.502 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/>
          <path d="M14.002 13a2 2 0 0 1-2 2h-10a2 2 0 0 1-2-2V5A2 2 0 0 1 2 3a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v8a2 2 0 0 1-1.998 2zM14 2H4a1 1 0 0 0-1 1h9.002a2 2 0 0 1 2 2v7A1 1 0 0 0 15 11V3a1 1 0 0 0-1-1zM2.002 4a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-10zm10 8H3l2.5-3.5 1.5 2 2.5-3.5 2.5 5z"/>
        </svg>
        Export Images
      </button>

      <button class="btn" id="btnThemeToggle" title="สลับโหมดมืด/สว่าง (Dark / Light Theme)">
        <span id="themeIcon">🌙</span>
      </button>

      <button class="btn btn-primary" id="btnExportHtml">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
          <path
            d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z" />
          <path
            d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z" />
        </svg>
        Export HTML
      </button>
    </div>
  </header>

  <input type="file" id="fileInput" accept=".json" style="display: none;">

  <!-- SLIDES MODE -->
  <main id="slidesContainer">
    <div class="slide-card" id="slideCard">

      <!-- Slide Header -->
      <div class="slide-header">
        <span class="step-badge" id="slideStepBadge">Step 1 of 5</span>
        <div class="step-text-title" id="slideStepTitle" contenteditable="true" title="คลิกเพื่อแก้ไขคำอธิบายขั้นตอน">
          กำลังโหลดขั้นตอน...</div>

        <div class="header-step-tools">
          <button class="icon-btn" id="btnToggleTip" title="เพิ่มข้อเสนอแนะ/คำเตือน (Tip)">
            💡
          </button>
          <button class="icon-btn" id="btnDeleteStep" title="ลบขั้นตอนนี้">
            🗑️
          </button>
        </div>
      </div>

      <!-- Slide Interactive Stage (Zoom / Pan / Spotlight) -->
      <div class="stage-wrapper" id="stageWrapper">
        <div class="pan-zoom-content" id="panZoomContent">
          <img src="" alt="Step Screen" id="slideImg" class="stage-image" />
          <div class="spotlight-ring" id="spotlightRing">
            <div class="ring-pulse"></div>
            <div class="ring-center-dot"></div>
          </div>
          <div class="target-box" id="targetBox" style="display: none;"></div>

        </div>

        <!-- Floating Zoom Controls -->
        <div class="floating-zoom-bar">
          <button class="zoom-btn" id="btnZoomOut" title="ย่อภาพ (-)">−</button>
          <span class="zoom-level-text" id="zoomLevelText">100%</span>
          <button class="zoom-btn" id="btnZoomIn" title="ขยายภาพ (+)">+</button>
          <button class="zoom-btn" id="btnZoomReset" title="รีเซ็ตขนาดภาพ (R หรือ 0)">↺</button>
          <button class="btn-focus-spotlight" id="btnFocusSpotlight" title="โฟกัสไปที่จุดคลิกครั้งเดียว (F)">
            <svg width="12" height="12" fill="currentColor" viewBox="0 0 16 16">
              <circle cx="8" cy="8" r="3" />
              <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8z" />
            </svg>
            Focus
          </button>
          <button class="btn-toggle-spotlight" id="btnToggleSpotlight" title="แสดง/ซ่อน วงแหวนโฟกัส Spotlight (คีย์ลัด H)">
            <span id="toggleSpotlightIcon">👁️</span>
            <span id="toggleSpotlightLabel">Show Focus</span>
          </button>
          <div class="focus-color-picker-wrap">
            <button class="focus-color-btn" id="btnFocusColor" title="วงแหวนเลือกสีโฟกัส (Focus Color Ring)"></button>
            <div class="focus-color-palette" id="focusColorPalette">
              <div class="color-swatch-ring" id="colorSwatchRing">
                <div class="color-swatch-center" id="colorSwatchCenter"></div>
                <div class="color-swatch" data-color="#39FF14" data-angle="0" style="background: #39FF14;" title="Hacker Green"></div>
                <div class="color-swatch" data-color="#00E5FF" data-angle="45" style="background: #00E5FF;" title="Cyan Glow"></div>
                <div class="color-swatch" data-color="#007AFF" data-angle="90" style="background: #007AFF;" title="Electric Blue"></div>
                <div class="color-swatch" data-color="#AF52DE" data-angle="135" style="background: #AF52DE;" title="Neon Purple"></div>
                <div class="color-swatch" data-color="#FF2D55" data-angle="180" style="background: #FF2D55;" title="Hot Pink"></div>
                <div class="color-swatch" data-color="#FF3B30" data-angle="225" style="background: #FF3B30;" title="Ruby Red"></div>
                <div class="color-swatch" data-color="#FF9500" data-angle="270" style="background: #FF9500;" title="Sunset Orange"></div>
                <div class="color-swatch" data-color="#FFCC00" data-angle="315" style="background: #FFCC00;" title="Bright Yellow"></div>
              </div>
            </div>
          </div>
          <button class="btn-auto-focus" id="btnAutoFocus" title="เปิด/ปิด การซูมโฟกัสอัตโนมัติทุกสเต็ป (คีย์ลัด A)">
            <span>🎯</span>
            <span id="autoFocusLabel">Auto Focus</span>
          </button>
        </div>
      </div>

      <!-- Optional Tip / Callout Box -->
      <div class="slide-note-box hidden" id="slideNoteBox">
        <span class="note-badge">💡 ข้อแนะนำ</span>
        <div class="note-text" id="slideNoteText" contenteditable="true"
          placeholder="พิมพ์ข้อแนะนำหรือคำเตือนสำหรับขั้นตอนนี้..."></div>
      </div>

      <!-- Slide Navigation Controls -->
      <div class="slides-controls">
        <button class="btn" id="btnPrev">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd"
              d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z" />
          </svg>
          <span class="btn-nav-label">ย้อนกลับ (Prev)</span>
        </button>

        <div class="timeline-bar" id="timelineBar"></div>

        <button class="btn btn-mint" id="btnNext">
          <span class="btn-nav-label">ถัดไป (Next)</span>
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd"
              d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z" />
          </svg>
        </button>
      </div>
    </div>
  </main>

  <!-- DOCUMENT MODE -->
  <main id="docContainer"></main>

  <!-- Edit Title Modal -->
  <div class="modal-overlay" id="titleModal">
    <div class="modal-card">
      <div class="modal-title">แก้ไขชื่อคู่มือ (Guide Title)</div>
      <div class="modal-body">
        <input type="text" id="inputEditTitle" placeholder="ระบุชื่อคู่มือ..." />
      </div>
      <div class="modal-actions">
        <button class="btn" id="btnCancelEditTitle">ยกเลิก</button>
        <button class="btn btn-primary" id="btnSaveEditTitle">บันทึก</button>
      </div>
    </div>
  </div>

  <!-- Export Images Modal -->
  <div class="modal-overlay" id="exportImagesModal">
    <div class="modal-card">
      <div class="modal-title">ส่งออกรูปภาพลงโฟลเดอร์ (Export Images)</div>
      <div class="modal-body" style="display: flex; flex-direction: column; gap: 14px;">
        <p style="font-size: 13px; color: var(--text-muted); line-height: 1.5;">
          ระบบจะบันทึกรูปภาพของทุกขั้นตอนลงในโฟลเดอร์บนเครื่องของคุณโดยตรง (เรียงชื่อไฟล์ step-01, step-02, ...)
        </p>
        <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; user-select: none;">
          <input type="checkbox" id="chkIncludeHighlight" checked style="width: 18px; height: 18px; accent-color: var(--mint); cursor: pointer;" />
          <span>วาดวงแหวนเน้นจุดคลิก (Highlight) ลงบนรูปภาพ</span>
        </label>
        <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; user-select: none;">
          <input type="checkbox" id="chkIncludeReadme" checked style="width: 18px; height: 18px; accent-color: var(--mint); cursor: pointer;" />
          <span>สร้างไฟล์สรุปเนื้อหาคู่มือ (README.md) ไว้ในโฟลเดอร์ด้วย</span>
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn" id="btnCancelExportImages">ยกเลิก</button>
        <button class="btn btn-primary" id="btnConfirmExportImages">เลือกโฟลเดอร์ & บันทึก</button>
      </div>
    </div>
  </div>

  <script src="viewer.js"></script>
</body>

</html>
